name: Update Registration Fields

on:
  workflow_dispatch:
    inputs:
      updates:
        description: "<rid> | field=value ... ;; <rid> | ... (fields: week=W1|W2|BOTH, first, last, email)"
        required: true
      dry_run:
        description: "Dry run (print current vs proposed, change nothing)"
        type: choice
        options: ["true", "false"]
        default: "true"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Update registration fields
        env:
          BIZZABO_CLIENT_ID:     ${{ secrets.BIZZABO_CLIENT_ID }}
          BIZZABO_CLIENT_SECRET: ${{ secrets.BIZZABO_CLIENT_SECRET }}
          BIZZABO_ACCOUNT_ID:    "129966"
          BIZZABO_EVENT_ID:      "754649"
          UPDATES:               ${{ inputs.updates }}
          DRY_RUN:               ${{ inputs.dry_run }}
        run: python update_registration.py
