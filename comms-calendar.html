<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVU 2026 — Communications Calendar</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0b0a1a;
  --bg-alt: #0f0e22;
  --card: #14122a;
  --card-hover: #1a1840;
  --card-border: #2a2650;
  --gold: #d4a843;
  --gold-dim: #a07e30;
  --purple: #7c3aed;
  --purple-light: #a78bfa;
  --purple-dim: #5b21b6;
  --text: #e8e4f0;
  --text-dim: #9a93b0;
  --text-muted: #6b6580;
  --green: #34d399;
  --green-dim: #065f46;
  --red: #f87171;
  --orange: #fb923c;
  --blue: #60a5fa;
  --teal: #06b6d4;
  --amber: #f59e0b;
  --radius: 14px;
  --radius-sm: 8px;
  --transition: 0.2s ease;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Floating orbs */
.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.15;
  pointer-events: none;
  z-index: 0;
}
.orb-1 { width: 500px; height: 500px; background: var(--purple); top: -100px; right: -100px; animation: float1 18s ease-in-out infinite; }
.orb-2 { width: 400px; height: 400px; background: var(--gold); bottom: -50px; left: -100px; animation: float2 22s ease-in-out infinite; }
.orb-3 { width: 300px; height: 300px; background: var(--teal); top: 50%; left: 50%; animation: float3 15s ease-in-out infinite; }

@keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-60px, 40px); } }
@keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(50px, -30px); } }
@keyframes float3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-40px, -50px); } }

.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 32px 24px;
  position: relative;
  z-index: 1;
}

/* Header */
.header {
  text-align: center;
  margin-bottom: 36px;
}
.header h1 {
  font-size: 2.4rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--gold), var(--purple-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}
.header .subtitle {
  color: var(--text-dim);
  font-size: 1rem;
}
.header .sync-badge {
  display: inline-block;
  margin-top: 10px;
  padding: 4px 14px;
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  font-size: 0.75rem;
  color: var(--text-muted);
}

/* Source toggle */
.source-toggle {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 8px;
}
.source-badge {
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.source-badge.active { background: var(--purple-dim); color: var(--purple-light); }
.source-badge.inactive { background: var(--card); color: var(--text-muted); }

/* Filter bar */
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 28px;
  align-items: flex-start;
}
.filter-group {
  flex: 1;
  min-width: 200px;
}
.filter-group label {
  display: block;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 6px;
  font-weight: 600;
}
.filter-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.pill {
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 0.75rem;
  cursor: pointer;
  border: 1px solid var(--card-border);
  background: var(--card);
  color: var(--text-dim);
  transition: all var(--transition);
  user-select: none;
}
.pill:hover { border-color: var(--purple); color: var(--text); }
.pill.active { background: var(--purple-dim); border-color: var(--purple); color: var(--purple-light); }
.pill.active-gold { background: rgba(212,168,67,0.15); border-color: var(--gold); color: var(--gold); }

/* KPI Row */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 14px;
  margin-bottom: 32px;
}
.kpi-card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 18px;
  text-align: center;
  transition: all var(--transition);
}
.kpi-card:hover { transform: translateY(-2px); border-color: var(--purple); }
.kpi-value {
  font-size: 2rem;
  font-weight: 800;
  line-height: 1;
  margin-bottom: 4px;
}
.kpi-label {
  font-size: 0.72rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  font-weight: 600;
}
.kpi-value.gold { color: var(--gold); }
.kpi-value.purple { color: var(--purple-light); }
.kpi-value.green { color: var(--green); }
.kpi-value.orange { color: var(--orange); }
.kpi-value.red { color: var(--red); }
.kpi-value.blue { color: var(--blue); }

/* View toggle */
.view-toggle {
  display: flex;
  justify-content: center;
  gap: 4px;
  margin-bottom: 24px;
  background: var(--card);
  border-radius: var(--radius);
  padding: 4px;
  width: fit-content;
  margin-left: auto;
  margin-right: auto;
  border: 1px solid var(--card-border);
}
.view-btn {
  padding: 8px 20px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  border-radius: 10px;
  transition: all var(--transition);
}
.view-btn.active { background: var(--purple); color: white; }
.view-btn:hover:not(.active) { color: var(--text); }

/* Section label */
.section-label {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 28px 0 16px;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--gold);
  font-weight: 700;
}
.section-label::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, var(--gold-dim), transparent);
}

/* Calendar View */
.calendar-container { }
.month-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  margin-bottom: 8px;
}
.month-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.month-title {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--text);
}
.month-nav {
  display: flex;
  gap: 8px;
}
.month-nav button {
  background: var(--card);
  border: 1px solid var(--card-border);
  color: var(--text-dim);
  width: 32px;
  height: 32px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1rem;
  transition: all var(--transition);
}
.month-nav button:hover { border-color: var(--purple); color: var(--text); }

.day-header {
  padding: 8px 4px;
  text-align: center;
  font-size: 0.7rem;
  color: var(--text-muted);
  text-transform: uppercase;
  font-weight: 700;
  letter-spacing: 1px;
}
.day-cell {
  min-height: 110px;
  background: var(--bg-alt);
  border-radius: 6px;
  padding: 6px;
  position: relative;
}
.day-cell.empty { background: transparent; opacity: 0.3; }
.day-cell.today { border: 1px solid var(--gold-dim); }
.day-number {
  font-size: 0.72rem;
  color: var(--text-muted);
  margin-bottom: 4px;
  font-weight: 600;
}
.day-cell.today .day-number { color: var(--gold); }

.email-chip {
  display: block;
  width: 100%;
  padding: 4px 6px;
  margin-bottom: 3px;
  border-radius: 4px;
  font-size: 0.65rem;
  line-height: 1.3;
  cursor: pointer;
  transition: all var(--transition);
  border-left: 3px solid;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.email-chip:hover { transform: scale(1.03); filter: brightness(1.2); }

/* Cancelled emails: muted with strikethrough */
.email-chip.cancelled, .timeline-block.cancelled {
  opacity: 0.35;
  text-decoration: line-through;
  filter: grayscale(0.6);
}
.email-chip.cancelled:hover, .timeline-block.cancelled:hover {
  opacity: 0.55;
}

/* Audience colors for chips */
.chip-all { background: rgba(124,58,237,0.15); border-color: var(--purple); color: var(--purple-light); }
.chip-vip { background: rgba(212,168,67,0.15); border-color: var(--gold); color: var(--gold); }
.chip-vipfc { background: linear-gradient(135deg, rgba(212,168,67,0.15), rgba(251,146,60,0.15)); border-color: var(--gold); color: var(--gold); }
.chip-fc { background: rgba(251,146,60,0.12); border-color: var(--amber); color: var(--amber); }
.chip-youth { background: rgba(52,211,153,0.12); border-color: var(--green); color: var(--green); }
.chip-volunteer { background: rgba(6,182,212,0.12); border-color: var(--teal); color: var(--teal); }
.chip-past { background: rgba(154,147,176,0.12); border-color: var(--text-muted); color: var(--text-dim); }
.chip-other { background: rgba(96,165,250,0.12); border-color: var(--blue); color: var(--blue); }

/* Timeline View */
.timeline-container { display: none; }
.timeline-container.active { display: block; }
.calendar-container.active { display: block; }
.calendar-container:not(.active) { display: none; }

.swimlane {
  margin-bottom: 20px;
}
.swimlane-label {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.swimlane-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}
.swimlane-track {
  position: relative;
  height: 44px;
  background: var(--bg-alt);
  border-radius: 8px;
  overflow: visible;
}
.timeline-block {
  position: absolute;
  top: 6px;
  height: 32px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  padding: 0 8px;
  font-size: 0.65rem;
  font-weight: 600;
  cursor: pointer;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  transition: all var(--transition);
  border-left: 3px solid;
}
.timeline-block:hover { filter: brightness(1.3); transform: scaleY(1.15); z-index: 10; }

.timeline-months {
  display: flex;
  margin-bottom: 8px;
  border-bottom: 1px solid var(--card-border);
  padding-bottom: 6px;
}
.timeline-month-label {
  font-size: 0.7rem;
  color: var(--text-muted);
  text-transform: uppercase;
  font-weight: 700;
  letter-spacing: 0.5px;
}

/* Today marker */
.today-marker {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--red);
  z-index: 5;
  opacity: 0.7;
}
.today-marker::after {
  content: "TODAY";
  position: absolute;
  top: -16px;
  left: -16px;
  font-size: 0.55rem;
  color: var(--red);
  font-weight: 700;
  letter-spacing: 1px;
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  justify-content: center;
  align-items: center;
  padding: 20px;
  backdrop-filter: blur(4px);
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  max-width: 800px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  padding: 0;
}
.modal-header {
  padding: 24px 28px 16px;
  border-bottom: 1px solid var(--card-border);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  position: sticky;
  top: 0;
  background: var(--card);
  z-index: 2;
}
.modal-title {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--gold);
}
.modal-close {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 1.5rem;
  cursor: pointer;
  padding: 0 4px;
  line-height: 1;
}
.modal-close:hover { color: var(--text); }
.modal-meta {
  padding: 16px 28px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.meta-tag {
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.72rem;
  font-weight: 600;
  border: 1px solid;
}
.modal-body {
  padding: 0 28px 28px;
}
.modal-section {
  margin-bottom: 20px;
}
.modal-section-title {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--gold);
  font-weight: 700;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.modal-section-title::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, var(--gold-dim), transparent);
}
.copy-block {
  background: var(--bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-sm);
  padding: 16px;
  font-size: 0.82rem;
  line-height: 1.7;
  color: var(--text-dim);
  white-space: pre-wrap;
  max-height: 300px;
  overflow-y: auto;
}
.ref-block {
  background: rgba(212,168,67,0.05);
  border: 1px solid rgba(212,168,67,0.2);
  border-radius: var(--radius-sm);
  padding: 16px;
  font-size: 0.78rem;
  line-height: 1.6;
  color: var(--text-muted);
  white-space: pre-wrap;
  max-height: 200px;
  overflow-y: auto;
}

/* Legend */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  margin-bottom: 20px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.7rem;
  color: var(--text-dim);
}
.legend-color {
  width: 12px;
  height: 12px;
  border-radius: 3px;
}

/* Responsive */
@media (max-width: 768px) {
  .container { padding: 16px 12px; }
  .header h1 { font-size: 1.6rem; }
  .kpi-row { grid-template-columns: repeat(3, 1fr); }
  .day-cell { min-height: 80px; }
  .email-chip { font-size: 0.58rem; padding: 3px 4px; }
  .filters { flex-direction: column; }
  .modal { max-height: 95vh; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--purple-dim); }

/* Airtable status indicator */
.airtable-status {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.68rem;
  color: var(--text-muted);
  margin-left: 8px;
}
.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}
.status-dot.connected { background: var(--green); }
.status-dot.offline { background: var(--orange); }
</style>
</head>

const EMBEDDED_DATA = [{"ID": "42", "Sequence": "Pre-Event Engagement", "Email_Name": "Christmas Email — by Vishen", "Audience": "All Valid Ticket Holders", "Subject_Line": "Dec 23: Christmas Email", "Proposed_Send_Date": "2025-12-23", "Day_of_Week": "Tuesday", "Status": "Sent", "CTA_Type": "Reply", "CTA_Description": "Reply to share what you're hoping for at MVU", "Notes": "Sent via Bizzabo by Vishen. Personal newsletter celebrating attendees joining MVU 2026. Asks attendees to reply with their intentions/hopes.", "Priority": "Medium", "Copy_2026": "Hi Álvaro,\n\nI just want to say this:\n\nYou've already given yourself one of the most powerful gifts of 2026.\n\nMindvalley U 2026 (a.k.a MVU 2026) is one of the biggest events we're creating next year, and you're part of it.\n\nThis year in Estonia, we're welcoming our highest attendance ever. And while I know you're excited, trust me, we're even more excited than you are.\n\nWhen you step into Mindvalley U coming summer, you'll feel something very different from a typical event.\n\nYou'll feel presence.\nYou'll feel a connection.\nYou'll feel what it means to be in a space where learning, growth, and real human connection actually coexist.\n\nThat's what makes Mindvalley U special.\n\nIt's not just the talks on stage though those are powerful. It's what happens between the sessions.\n\nThe conversations that go deep, fast.\nThe friendships that form naturally.\nThe moments with your family that don't feel rushed or distracted.\nThe kind of transformation that doesn't end when the music fades — it continues over dinner, in workshops, on long walks, and unexpected conversations.\n\nI've seen it happen year after year.\n\nPeople arrive curious. They leave transformed.\n\nNot because they tried harder. But because they finally showed up & slowed down enough to reconnect with themselves and with others.\n\nSo as you start thinking about 2026, forget the pressure of resolutions.\n\nInstead, ask yourself a better question:\n\nWhat kind of connections do I want to create this year?\n\nIn MVU 2026,\nWho do I want to meet?\nWho do I want to learn from?\nWhat kind of conversations do I want to be part of?\nWhat kind of network or even friendships do I want to build?\n\nAnd here's something I'd love you to do.\n\nHit reply to this email and tell us what you're hoping for at Mindvalley U.\n\nMaybe you want to find a business partner.\nMaybe you're open to love.\nMaybe you want a new best friend from a different country.\nMaybe you're looking for opportunity, clarity, or inspiration.\nOr maybe you just want a chance to have a real conversation with me.\n\nWhatever it is, tell us your heart's desire.\n\nOnce you're inside this tribe, you're part of us.\n\nAnd if there's a way we can help make something meaningful happen for you while you're there, we'll do our best to make it happen.\n\n💌 Coming Soon 💌\n\nStarting January, we'll begin sharing more details with you:\nSpeaker previews, behind-the-scenes moments, youth program highlights, and everything you need to start visualizing your summer in Tallinn.\n\nBut for now, just know this:\n\nYou're part of something special. And we can't wait to co-create it with you.\n\nHit reply to this email and tell us what you're hoping for at Mindvalley U.\n\nWith so much love and excitement,\nVishen", "Reference_2025_Copy": "[Vishen newsletter — first MVU 2026 communication after ticket purchase]", "Prep_Notification_Date": "2025-12-16"}, {"ID": "43", "Sequence": "Pre-Event Engagement", "Email_Name": "Why We Built Mindvalley U — by Vishen", "Audience": "All Valid Ticket Holders", "Subject_Line": "Jan 15: Why We Built Mindvalley U", "Proposed_Send_Date": "2026-01-16", "Day_of_Week": "Friday", "Status": "Sent", "CTA_Type": "Soft", "CTA_Description": "Encourages attendees to start booking flights/accommodation", "Notes": "Sent via Bizzabo by Vishen. Origin story of MVU. Storytelling email building anticipation for Tallinn 2026.", "Priority": "Medium", "Copy_2026": "Hi Álvaro,\n\nBack in 2016, I had a wild idea.\n\nWhat if education could be… fluid?\n\nWhat if instead of being bound to one campus, one curriculum, one way of learning — we could create a global, rotating campus where growth was immersive, cultural, deeply connected… and yes, even fun?\n\nI imagined a space where my family could grow alongside me.\nWhere my kids could learn the life skills traditional schools forgot.\nWhere friendships turned into soul tribes.\nAnd where love, business, ideas, and transformation could all happen over lunch — or a late-night walk in a new city.\n\nThat idea became Mindvalley University.\n\nNow lovingly called Mindvalley U. Or MVU — because this experience truly is about you.\n\nAnd what started as a one-time experiment in Barcelona… has now become one of the most beloved events in the Mindvalley world, spanning over a decade and touching thousands of lives from over 80 countries.\n\nSo why am I writing to you today?\nBecause this July, you're coming to Tallinn.\n\nThe birthplace of that idea.\n\nAnd I want you to know what you've stepped into.\n\nYou're not just attending an event.\nYou're becoming part of a living movement.\n\nYou'll learn from world-class mentors across every area of life — from AI and social media to relationships, parenting, embodiment, entrepreneurship, and inner healing.\n\nYou'll be surrounded by people who will become your collaborators, soul friends, and sometimes, your forever people.\n\nAnd your kids?\nThey'll be immersed in our amazing Youth Programs — often cited as the highlight of MVU both for young and adult attendees — where they're not just taught, but seen, empowered, and inspired.\n\nThis is where transformation becomes real.\nNot through content, but through connection.\n\nWhether you're coming for the first time, or are one of the beautiful souls who returns year after year, just know…\n\nYou're part of something extraordinary.\n\nWe'll see you in Tallinn.\n\nAnd oh — if you haven't started looking at flights or accommodation yet, now's a good time to begin.\n\nWith love,\nVishen", "Reference_2025_Copy": "[Vishen newsletter — origin story of MVU, building emotional connection to Tallinn]", "Prep_Notification_Date": "2026-01-09"}, {"ID": "44", "Sequence": "Pre-Event Engagement", "Email_Name": "The Last Real Thing — by Vishen", "Audience": "All Valid Ticket Holders", "Subject_Line": "Jan 23: The Last Real Thing", "Proposed_Send_Date": "2026-01-23", "Day_of_Week": "Friday", "Status": "Sent", "CTA_Type": "Link", "CTA_Description": "Invite a friend link (early-bird offer)", "Notes": "Sent via Bizzabo by Vishen. Personal vulnerable email about turning 50, AI world context, friend-invitation upsell, and Tribe Stage teaser.", "Priority": "Medium", "Copy_2026": "Hi Álvaro,\n\nIn my last newsletter, I shared something raw.\n\nI turned 50 this month. And with it came a decision that now shapes everything I do: I want to live 100 lives before I die.\n\nOne week at a time.\nOne place at a time.\nOne version of myself at a time.\n\nThat's how I've started showing up.\n\nRight now, I'm in Sevilla, Spain, leading the first-ever in-person Manifesting Coaching Certification with Regan Hillyer and 50 incredible humans.\n\nWe're not just \"doing a program.\"\n\nWe're learning together. Laughing over late dinners. Walking through ancient streets.\nAnd going deep with the program and with each other.\n\nAnd it reminded me that, this how MVU feels for all our attendees\n\n🌍 Why Mindvalley U Exists in an AI World\n\nAs the world races ahead with AI, automation, and digital everything…I feel a quiet urgency.\n\nBecause the more digital life becomes, the more valuable it is to gather as humans.\n\nTo sit face-to-face.\nTo share a conversation that meanders into the night.\nTo grow alongside others who are alive, awake, and building extraordinary lives — just like you.\n\nThat's what MVU is about: A living, breathing learning experience. And this year, it's going to be the biggest one yet.\n\nAt Mindvalley U 2026 in Tallinn, you'll find yourself surrounded by:\n\nEntrepreneurs who've built global businesses — and want more meaning, not just metrics\nParents and educators raising conscious kids\nHealers, artists, futurists, creatives\nAnd yes — some of the kindest, most brilliant minds you'll ever meet\n\nMany of these people arrive solo. But they don't leave that way.\n\nSo if you're coming alone, I want to ask you something:\n\n👉 Bring someone with you.\n\nWhether it's a friend, partner, colleague, or your kids— MVU becomes exponentially more powerful when it's shared.\n\nSend them this email or invite them to grab their ticket here:\n\nClick here to invite a friend to MVU (our early-bird offer ends this month)\n\n🎤 A Heads-Up About Something Exciting\nEach year at MVU, we open something called the Mindvalley Tribe Stage — a platform for you to teach, speak, and lead.\n\nWe'll be announcing applications for 2026 soon, but here's what you need to know now:\n\nTo apply, you'll need to have a 2-week ticket, as your talk could happen on any day of MVU\nYou'll have the chance to share your voice, wisdom, and ideas with an audience like no other\nWhether you're an educator, coach, entrepreneur, healer — this could be your moment to give back in a powerful way\n\nStay tuned for updates. But if this sparks something in you — start thinking now.\n\nWhat would you share? What lights you up? What's your message?\n\nThis could be your stage.\n\nIn 2026, MVU returns to Tallinn, Estonia — the birthplace of this idea.\n\nA city where medieval walls meet modern tech.\nWhere history and future live side by side.\nAnd where, this July, you'll reclaim one of the most precious experiences of our time:\n\n✨ Connection.\n✨ Belonging.\n✨ Aliveness.\n\nLet's live one of our 100 lives together this July.\n\nWith love,\nVishen", "Reference_2025_Copy": "[Vishen newsletter — vulnerable storytelling, friend-invite upsell, Tribe Stage teaser]", "Prep_Notification_Date": "2026-01-16"}, {"ID": "1", "Sequence": "Pre-Event Engagement", "Email_Name": "Partnership Announcement (Youth)", "Audience": "Youth Programs Ticket Holders", "Subject_Line": "The Future of Education Is Here — And Your Child Gets To Be Part of It! 🎒", "Proposed_Send_Date": "2026-02-16", "Day_of_Week": "Monday", "Status": "Cancelled", "CTA_Type": "Link", "CTA_Description": "Link to partner blog article", "Notes": "Announce educational partner for Youth Programs. Adapt to Tallinn context. | CANCELLED on 2026-04-29 — no longer relevant for MVU 2026.", "Priority": "Medium", "Copy_2026": "Hey [First Name],\n\nExciting news — Mindvalley University 2026 is about to get even more extraordinary for your little ones.\n\nFor another year, Mindvalley is partnering with Learnlife, the pioneering school that's redefining education worldwide. Forget memorization — Learnlife's approach is all about self-directed learning, real-world skills, and igniting a passion for lifelong growth.\n\nTheir model is already transforming schools across Europe, the Americas, and the UAE — and now, we're bringing it once again to our Mindvalley University Youth Programs in the beautiful city of Tallinn. 🇪🇪\n\nImagine your child diving into hands-on, curiosity-driven workshops where they explore what truly excites them — whether it's entrepreneurship, creative problem-solving, or future-ready skills. They'll connect with like-minded peers, learn from inspiring mentors, and thrive in an environment that fosters independence, innovation, and confidence.\n\nWe can't wait to welcome your family to Tallinn this summer — where, alongside Learnlife, we'll create an unforgettable experience that empowers the next generation of changemakers.\n\nWant to learn more about the future of education and why we're so excited about Learnlife?\n\n👉 Read this article on our Mindvalley Blog here.\n\nStay tuned — more exciting details coming your way soon!\n\nWith excitement and gratitude,\nThe Mindvalley Events Team", "Reference_2025_Copy": "[Mar 3, 2025 — Partnership Announcement]\nAudience: Youth Programs Valid Ticket Holders\nSubject: The Future of Education Is Here—And Your Child Gets To Be Part of It! 🎒\nKey content: Announced Learnlife partnership (second year). Highlighted self-directed learning, real-world skills. Mentioned Learnlife's global presence. Invited families to Amsterdam. Linked to Mindvalley Blog article about Learnlife. Signed by Mindvalley Events Team (originally by Gigi Marquez Suarez).", "Prep_Notification_Date": "2026-02-09"}, {"ID": "34", "Sequence": "Pre-Event Engagement", "Email_Name": "Reminder To Assign Tickets", "Audience": "Buyers with Unassigned Tickets", "Subject_Line": "Reminder To Assign Tickets", "Proposed_Send_Date": "2026-02-24", "Day_of_Week": "Tuesday", "Status": "Sent", "CTA_Type": "Link", "CTA_Description": "Assign tickets link", "Notes": "Sent via Bizzabo. Reminder for buyers who haven't assigned their tickets yet.", "Priority": "High", "Copy_2026": "Hi Álvaro,\n\nWe're reaching out with a quick reminder before Mindvalley U 2026.\n\nYou've purchased multiple tickets, but they haven't been assigned yet. To ensure a smooth check-in experience, please assign each ticket to the appropriate attendee as soon as possible.\n\n❗Tickets must be assigned to a named attendee to be considered fully registered.\n\nHow to Assign Your Tickets:\n\n1. Click the \"Manage your Registration\" button below.\n2. Transfer the ticket to the attendee so they can complete their registration.\n   ○ Don't forget to register yourself if you are attending!\n3. If transferring the ticket, click \"Transfer Registration\", then enter the attendee's first name, last name, and email. They'll receive a link to complete their registration.\n4. If you're filling out the registration yourself, click \"Complete Registration\" and enter the necessary details.\n\nWith so much love and excitement,\n\nThe Mindvalley Events team", "Reference_2025_Copy": "[No 2025 reference — operational email]", "Prep_Notification_Date": "2026-02-17"}, {"ID": "35", "Sequence": "Pre-Event Engagement", "Email_Name": "Youth Program - Preference Form To Parents", "Audience": "Parents with Youth Program Tickets", "Subject_Line": "Youth Program - Preference Form To Parents", "Proposed_Send_Date": "2026-02-28", "Day_of_Week": "Saturday", "Status": "Sent", "CTA_Type": "Link", "CTA_Description": "Preference form link", "Notes": "Sent via Bizzabo. Parents fill out preference form for youth programs.", "Priority": "High", "Copy_2026": "Hi Álvaro,\n\nTo confirm your child's place in the Mindvalley U 2026 Youth Program, please complete the Youth Programs Preference Survey.\n\nOne form per child.\n\nWe use your answers to plan pick-up permissions, English support, allergies/dietary needs, learning accommodations, and how to best engage your child. We'll also ask about photo/video permission for daily parent updates (Learnlife + Mindvalley).\n\nSurvey link: here.\n\nThis survey is necessary to confirm a place in the program. If we don't receive the survey by April, 1st, we may need to release the spot to a waitlisted family.\n\nThank you for helping us awaken their greatness, safely and smoothly.\n\nMindvalley Youth Programs Team.", "Reference_2025_Copy": "[No 2025 reference — operational email]", "Prep_Notification_Date": "2026-02-21"}, {"ID": "36", "Sequence": "Pre-Event Engagement", "Email_Name": "Second Reminder To Assign Tickets - March 5th", "Audience": "Buyers with Unassigned Tickets", "Subject_Line": "Second Reminder To Assign Tickets - March, 5th", "Proposed_Send_Date": "2026-03-05", "Day_of_Week": "Thursday", "Status": "Sent", "CTA_Type": "Link", "CTA_Description": "Assign tickets link", "Notes": "Sent via Bizzabo. Second reminder for unassigned tickets.", "Priority": "High", "Copy_2026": "Hey Álvaro,\n\nA quick (but important) heads-up: one of your Mindvalley U 2026 ticket(s) is currently at risk because it hasn't been assigned to a named ticket holder yet.\n\nHere's why this matters: your registration is only considered complete once every ticket has a ticket holder assigned.\n\nPlease take a moment to fix this now:\n\nAssign your ticket holder:\n\n1) Click \"Manage your Registration\" below.\n2) For the unassigned ticket, choose one option:\n      - Transfer Registration: enter the attendee's first name, last name, and email. They'll receive a link to complete registration.\n      - Complete Registration: fill out the attendee details yourself.\n3) If you're attending, make sure one ticket is assigned to you.\n\nWe can't wait to see you in Tallinn — it's going to be unforgettable.\n\nWith love,\n\nThe Mindvalley Events team", "Reference_2025_Copy": "[No 2025 reference — operational email]", "Prep_Notification_Date": "2026-02-26"}, {"ID": "37", "Sequence": "Pre-Event Engagement", "Email_Name": "Third Reminder To Assign Tickets - March 16th", "Audience": "Buyers with Unassigned Tickets", "Subject_Line": "Third Reminder To Assign Tickets - March, 16th", "Proposed_Send_Date": "2026-03-16", "Day_of_Week": "Monday", "Status": "Sent", "CTA_Type": "Link", "CTA_Description": "Assign tickets link", "Notes": "Sent via Bizzabo. Third reminder for unassigned tickets.", "Priority": "Medium", "Copy_2026": "Hey Álvaro,\n\nA quick (but important) heads-up: one of your Mindvalley U 2026 ticket(s) is currently at risk because it hasn't been assigned to a named ticket holder yet.\n\nHere's why this matters: your registration is only considered complete once every ticket has a ticket holder assigned.\n\nPlease take a moment to fix this now:\n\nAssign your ticket holder:\n\n1) Click \"Manage your Registration\" below.\n2) For the unassigned ticket, choose one option:\n      - Transfer Registration: enter the attendee's first name, last name, and email. They'll receive a link to complete registration.\n      - Complete Registration: fill out the attendee details yourself.\n3) If you're attending, make sure one ticket is assigned to you.\n\nWe can't wait to see you in Tallinn — it's going to be unforgettable.\n\nWith love,\n\nThe Mindvalley Events team", "Reference_2025_Copy": "[No 2025 reference — operational email]", "Prep_Notification_Date": "2026-03-09"}, {"ID": "39", "Sequence": "Pre-Event Engagement", "Email_Name": "Fourth Reminder To Assign Tickets - March 26th", "Audience": "Buyers with Unassigned Tickets", "Subject_Line": "Fourth Reminder To Assign Tickets - March, 26th", "Proposed_Send_Date": "2026-03-26", "Day_of_Week": "Thursday", "Status": "Sent", "CTA_Type": "Link", "CTA_Description": "Assign tickets link", "Notes": "Sent via Bizzabo. Fourth reminder for unassigned tickets.", "Priority": "Medium", "Copy_2026": "Hey Álvaro,\n\nThis is important — and time-sensitive.\n\nOne of your Mindvalley U 2026 tickets is currently at risk because it's still unassigned (no named ticket holder). And until every ticket has a name attached, the registration isn't complete.\n\nPlease assign the ticket holder now (it takes 60 seconds):\n\nClick \"Manage your Registration\" below.\nFind the unassigned ticket, then choose one:\n\nTransfer Registration: add the attendee's first name, last name, and email (they'll get a link to complete registration).\nComplete Registration: enter the attendee details yourself.\nIf you're attending, make sure one ticket is assigned to you.\n\nWe'd hate for something this small to affect your MVU experience. Assign it now and you're all set.\n\nWith love,\nThe Mindvalley Events Team.", "Reference_2025_Copy": "[No 2025 reference — operational email]", "Prep_Notification_Date": "2026-03-19"}, {"ID": "4", "Sequence": "Pre-Event Engagement", "Email_Name": "Volunteer Reminders", "Audience": "General Volunteer Database", "Subject_Line": "Last Call to Volunteer at Mindvalley University 2026 in Tallinn! 🌍✨", "Proposed_Send_Date": "2026-03-27", "Day_of_Week": "Friday", "Status": "Cancelled", "CTA_Type": "Link", "CTA_Description": "Volunteer application link", "Notes": "Open volunteer applications. Update city and dates. | CANCELLED on 2026-04-29 — no longer relevant for MVU 2026.", "Priority": "Medium", "Copy_2026": "Hey [First Name],\n\nIf you've been thinking about volunteering at a Mindvalley event... this is your moment. 🌟\n\nWe're currently inviting passionate, high-vibe humans to apply as volunteers for Mindvalley University 2026 — happening in the stunning city of Tallinn, Estonia from July 20 to August 2, 2026.\n\nVolunteering at Mindvalley University isn't just about helping run an event. It's about becoming part of a movement. You'll connect deeply with the global Mindvalley community, contribute your energy to something truly transformational, and walk away with memories (and friendships) that last a lifetime.\n\n👉 Apply to be a volunteer for Mindvalley University 2026 here: [Insert MVU Volunteer Application Link]\n\nLet's co-create something extraordinary,\nMindvalley Events Team", "Reference_2025_Copy": "[Apr 11, 2025 — Volunteer Reminders]\nAudience: General Volunteer Database\nSubject: Last Call to Volunteer at Mindvalley University 2025 + Manifesting Summit in LA\nKey content: Volunteer call for MVU Amsterdam Aug 4-17. Emphasized: movement, deep connection, transformation, lifetime friendships. Also included bonus opportunity for Manifesting Summit in LA (May 17-18). Signed by Mindvalley Events Team.", "Prep_Notification_Date": "2026-03-20"}, {"ID": "40", "Sequence": "Pre-Event Engagement", "Email_Name": "Tribe Stage Application", "Audience": "All Valid Ticket Holders (No Youth Program)", "Subject_Line": "Tribe Stage Application", "Proposed_Send_Date": "2026-04-06", "Day_of_Week": "Monday", "Status": "Sent", "CTA_Type": "Link", "CTA_Description": "Tribe Stage application form", "Notes": "Sent via Bizzabo. Tribe Stage applications opened. NOTE: This overlaps with planned email #5 (Tribe Speaker Application on Apr 20) — may want to remove or repurpose #5.", "Priority": "High", "Copy_2026": "Hey Álvaro,\n\nApplications for the Tribe Stage at Mindvalley University 2026 are officially open. And this is your chance to become part of the Mindvalley U experience in a bigger way.\n\nThe Tribe Stage isn't just a place to host a session. It's where fresh voices rise, powerful ideas are shared, and members of our community step into leadership.\n\nIf you've felt the spark to teach, guide, move, awaken, or inspire others—this may be the invitation you've been waiting for.\n\n🎤 What is the Tribe Stage?\n\nThe Tribe Stage is a space for Mindvalley Members to lead community sessions during MVU. From transformational workshops and embodiment practices to guided meditations, conscious conversations, and bold new ideas—this is where your wisdom gets to meet the right audience.\n\nWe're looking for sessions that are authentic, engaging, and deeply aligned with the Mindvalley spirit.\n\n✨ This is for you if:\n\n✅ You have a valid MVU 2026 ticket\n✅ You feel ready to contribute from your experience, heart, and voice\n✅ You're excited to create impact within the Mindvalley community\n\n👉 Apply for the Tribe Stage here:\nClick here to submit your application\n\nSpaces are limited, and every application will be carefully reviewed.\n\nFor some, the Tribe Stage becomes more than a single session. It becomes the beginning of something bigger—a new level of visibility, contribution, and expression within the Mindvalley ecosystem.\n\nSo if something in you is saying yes… trust it.\n\nWith love and excitement,\nThe Mindvalley Events Team.", "Reference_2025_Copy": "[See email #5 for planned 2026 copy and 2025 reference]", "Prep_Notification_Date": "2026-03-30"}, {"ID": "41", "Sequence": "Pre-Event Engagement", "Email_Name": "Fifth Reminder To Unassigned Tickets - April 14th", "Audience": "Buyers with Unassigned Tickets", "Subject_Line": "Fifth reminder to unassigned tickets (April 9th)", "Proposed_Send_Date": "2026-04-14", "Day_of_Week": "Tuesday", "Status": "Sent", "CTA_Type": "Link", "CTA_Description": "Assign tickets link", "Notes": "Sent via Bizzabo. Originally scheduled April 9th, actually sent April 14th.", "Priority": "Medium", "Copy_2026": "Hey Álvaro,\n\nThis is serious — please read carefully.\n\nAt least one of your Mindvalley U 2026 tickets is still unassigned (no named ticket holder). If you don't take immediate action, this ticket will be canceled.\n\nTo keep the ticket active, you must assign it to a specific attendee. Until every ticket has a name attached, registration isn't complete — and unassigned tickets can't be honored at check-in.\n\nFix this right now (60 seconds):\n\nClick \"Manage your Registration\" below.\nFind the unassigned ticket, then choose one:\n\nTransfer Registration: enter the attendee's first name, last name, and email (they'll receive a link to complete registration).\nComplete Registration: enter the attendee details yourself.\n\nIf you're attending, make sure one ticket is assigned to you.\n\nDon't risk losing this spot. Assign the ticket now and you're fully set.\n\nWith love,\nThe Mindvalley Events Team", "Reference_2025_Copy": "[No 2025 reference — operational email]", "Prep_Notification_Date": "2026-04-07"}, {"ID": "5", "Sequence": "Pre-Event Engagement", "Email_Name": "Tribe Speaker Application (originally planned)", "Audience": "All Valid Ticket Holders", "Subject_Line": "Your Moment to Shine at Mindvalley University 2026 🌟", "Proposed_Send_Date": "2026-04-20", "Day_of_Week": "Monday", "Status": "Cancelled", "CTA_Type": "Link", "CTA_Description": "Tribe Stage application form", "Notes": "CANCELLED on 2026-04-29 — already sent on April 6 via Bizzabo (see #40 Tribe Stage Application). Reminder follow-up created as #45 (May 11).", "Priority": "Medium", "Copy_2026": "[CANCELLED — already sent April 6 via Bizzabo. See #40 for sent copy.]", "Reference_2025_Copy": "[May 5, 2025 — Tribe Speaker Application] Audience: All Valid Ticket Holders. Subject: Your Moment to Shine at Mindvalley University 2025 🌟. Key content: Opened Tribe Stage applications. Eligibility: active member, valid ticket, not a volunteer. Framed as launchpad for voice in MV ecosystem.", "Prep_Notification_Date": "2026-04-13"}, {"ID": "6", "Sequence": "Pre-Event Engagement", "Email_Name": "Volunteer Stories", "Audience": "Volunteer Database", "Subject_Line": "Have You Volunteered with Us? We'd Love to Hear Your Story 💬", "Proposed_Send_Date": "2026-04-24", "Day_of_Week": "Friday", "Status": "Cancelled", "CTA_Type": "Link", "CTA_Description": "Story submission form", "Notes": "Gather volunteer testimonials. | CANCELLED on 2026-04-29 — no longer relevant for MVU 2026.", "Priority": "Low", "Copy_2026": "Hey [First Name],\n\nWhether you helped guide attendees, supported our speakers, or brought the vibes to the dance floor — if you've volunteered at any Mindvalley event, we want to hear your story.\n\nYou are a vital part of the energy that makes our events so unforgettable. And now, we'd love to know:\n\n✨ What did volunteering mean to you?\n✨ What was your most memorable moment?\n✨ How did the experience impact your life?\n\nWe're gathering volunteer stories to celebrate the amazing humans behind the scenes (aka YOU). Your reflections might be featured in our community channels — or even inspire future volunteers to join the journey.\n\n👉 Share your story here: [Form Link]\n\nBig or small, funny or profound — your story matters. Thank you for showing up, supporting the tribe, and being part of the Mindvalley movement.\n\nWith gratitude,\nMindvalley Events Team\n\nP.S. If you've been meaning to share but haven't yet — now's the perfect time. We can't wait to read your words. 💙", "Reference_2025_Copy": "[May 7, 2025 — Volunteer Stories]\nAudience: Volunteer Database\nSubject: Have You Volunteered with Us? We'd Love to Hear Your Story 💬\nKey content: Called for volunteer testimonials from any past MV event. Asked 3 questions: meaning, memorable moment, life impact. Stories potentially featured in community channels. Signed by Mindvalley Events Team.", "Prep_Notification_Date": "2026-04-17"}, {"ID": "46", "Sequence": "Pre-Event Engagement", "Email_Name": "Bring A Friend To MVU", "Audience": "All adult ticket holders (No Youth Program attendee)", "Subject_Line": "Who Would You Bring to Tallinn? 💛", "Proposed_Send_Date": "2026-04-30", "Day_of_Week": "Thursday", "Status": "Sent", "CTA_Type": "Link", "CTA_Description": "Friend-invite / referral link: https://www.mindvalley.com/u?promo=bringafriend&tr=true", "Notes": "SENT via Bizzabo Apr 30. Dedicated referral campaign. Real URL embedded in copy.", "Priority": "Medium", "Copy_2026": "Hey [First Name],\n\nThere's a question I keep coming back to — one I'd love to share with you today.\n\nWho in your life would light up if you told them you're going to Tallinn?\n\nA best friend who needs a reset.\nA partner you've been promising adventures.\nA sibling who'd geek out over the speakers.\nYour kids, ready for the most magical Youth Program in the world.\n\nAt Mindvalley U, the people who arrive together come back unrecognizable — closer, deeper, more alive. Because the magic of MVU isn't only in the talks. It's in the late-night conversations, the spontaneous lunches, the dance floors at midnight, the breakthroughs you witness in someone you love.\n\nIf there's someone you've been thinking about — even subtly — this is your nudge to follow that thread.\n\n🤝 Why MVU is exponentially better when shared\n\n✨ Memories that don't fade — because you have someone to relive them with\n✨ Deeper transformations — because growth is contagious\n✨ Practical perks — share a room, split logistics, help each other through long travel days\n✨ A shared chapter — the kind your future self will look back on with gratitude\n\nHow to bring someone with you\n\nIt only takes a moment. Forward this email, or copy and send them their invite directly here:\n\nhttps://www.mindvalley.com/u?promo=bringafriend&tr=true\n\nWhoever you choose — friend, partner, sibling, parent — bring them with you.\n\nTallinn is going to be unforgettable. And the best part of unforgettable? Being able to say \"remember when we…\" to someone who was right there beside you.\n\nWith love,\nThe Mindvalley Events Team\n\nP.S. Not sure who to invite? Forward this email to three people who came to mind as you read it, or copy the link above and send it to them directly. Sometimes the right person reveals themselves when we name them.", "Reference_2025_Copy": "[No 2025 reference — new initiative for 2026, requested by Marketing as standalone referral campaign]", "Prep_Notification_Date": "2026-04-29"}, {"ID": "45", "Sequence": "Pre-Event Engagement", "Email_Name": "Tribe Stage Application - Reminder May 6th", "Audience": "All adult ticket holders (No Youth Program attendee)", "Subject_Line": "A Quick Reminder About the Tribe Stage 🎤", "Proposed_Send_Date": "2026-05-06", "Day_of_Week": "Wednesday", "Status": "Sent", "CTA_Type": "Link", "CTA_Description": "Tribe Stage application form", "Notes": "SENT via Bizzabo May 6. First of three reminder follow-ups.", "Priority": "Medium", "Copy_2026": "Hey [First Name],\n\nA few weeks ago, we opened the Tribe Stage at Mindvalley University 2026 — and we just wanted to circle back, in case it slipped your radar.\n\nThe Tribe Stage is a space we created for Mindvalley Members like you to lead a session during MVU. To share what you've been quietly building, healing through, or living into. To meet your audience face-to-face in Tallinn.\n\nWe've already received some beautiful applications. And as we keep curating the experience, we're still keeping the door open — because we know how busy life gets, and we don't want anyone to miss this simply because they didn't see the email the first time.\n\n🎤 As a quick recap\n\nThe Tribe Stage is for community-led sessions during MVU 2026 — workshops, embodiment practices, guided meditations, conscious conversations, fresh ideas. Anything that's authentic, engaging, and aligned with the Mindvalley spirit.\n\n✨ This is for you if:\n\n✅ You hold a valid MVU 2026 ticket\n✅ You feel ready to share from your experience, heart, and voice\n✅ You're excited to create real impact within the Mindvalley community\n\nFor some, this becomes more than a single session — it's the start of something bigger within the Mindvalley ecosystem. For others, it's simply a beautiful chance to give back.\n\nEither way, if something inside you is whispering yes… we'd love to hear from you.\n\n👉 Apply for the Tribe Stage here: [Application Link]\n\nWith love,\nThe Mindvalley Events Team", "Reference_2025_Copy": "[See email #40 (sent April 6) for the original launch copy and email #5 from 2025 reference]", "Prep_Notification_Date": "2026-05-04"}, {"ID": "50", "Sequence": "Pre-Event Engagement", "Email_Name": "Party & Social Calendar Reveal", "Audience": "All adult ticket holders (No Youth Program attendee)", "Subject_Line": "Socials & Parties — The other curriculum at Mindvalley U 🎉", "Proposed_Send_Date": "2026-05-18", "Day_of_Week": "Monday", "Status": "Sent", "CTA_Type": "Soft", "CTA_Description": "No hard CTA — teaser email setting up the party series", "Notes": "SENT via Bizzabo May 18. First of the party reveal series. Replaces standalone #9 Style Guide which was cancelled.", "Priority": "High", "Copy_2026": "Hey [First Name],\n\nWe have a confession to make.\n\nSome of the most transformational moments at Mindvalley U have nothing to do with what happens on stage.\n\nThey happen at 1 AM on a dance floor. They happen in a quiet corner of a crowded room. They happen when you're wearing something so utterly ridiculous and joyful that you forget to be the \"you\" you're supposed to be.\n\nThe talks and workshops are for your mind. The parties are for your soul.\n\nThis is where the real integration happens. It's where strangers become the friends you'll have for life. Where a single conversation can change your business, your relationships, or your entire perspective.\n\nSo, while we're putting the finishing touches on the main curriculum, we wanted to give you a glimpse into the other curriculum. The one that unfolds after the sun goes down.\n\nHere's a taste of what we have planned for your evenings in Tallinn:\n\nWeek 1: The Spark\n\n🔵 Monday, July 20: The city is your campus. We start with a social gathering that spills across one of Tallinn's coolest districts.\n🎭 Thursday, July 23: An exclusive night for our VIP & First Class tribe. Think mystery, elegance, and connection.\n🖤 Friday, July 24: We go deeper. A second night where the tribe finds each other through color and the coolest city district.\n🐇 Saturday, July 25: The official Opening Celebration. This is where we set the tone for the adventure ahead.\n\nWeek 2: The Deep Dive\n\n🤍 Monday, July 27: We take over a new part of the city. Deeper connections, new energy.\n🌊 Thursday, July 30: The second VIP & First Class experience. If you thought the first was special, just wait.\n🇪🇪 Friday, July 31: One of the final nights together in the colors that unite us all.\n🌿 Saturday, August 1: The Grand Finale. We close out two weeks together with a celebration\n\nThis is just the beginning. In the coming weeks, we'll be sharing the themes, the secret locations, and the dress codes.\n\nAnd trust me — you're going to want to pack a second suitcase.\n\nSee you in Tallinn,\nThe Mindvalley U Team", "Reference_2025_Copy": "[Party reveal series email #1 — sets up Week 1 and Week 2 party arcs at high level]", "Prep_Notification_Date": "2026-05-11"}, {"ID": "49", "Sequence": "Pre-Event Engagement", "Email_Name": "Youth Program - Preference Form To Parents (Reminder)", "Audience": "Parents with Youth Program tickets after 27/02/26 (22/05/26)", "Subject_Line": "Youth Programs - Preference Form Reminder", "Proposed_Send_Date": "2026-05-22", "Day_of_Week": "Friday", "Status": "Sent", "CTA_Type": "Link", "CTA_Description": "Preference form link", "Notes": "SENT via Bizzabo May 22. Reminder for parents who bought tickets after the original send (Feb 28). Deadline updated to June 15.", "Priority": "High", "Copy_2026": "Hi [First Name],\n\nTo confirm your child's place in the Mindvalley U 2026 Youth Program, please complete the Youth Programs Preference Survey.\n\nOne form per child.\n\nWe use your answers to plan pick-up permissions, English support, allergies/dietary needs, learning accommodations, and how to best engage your child. We'll also ask about photo/video permission for daily parent updates (Learnlife + Mindvalley).\n\nSurvey link: here.\n\nThis survey is necessary to confirm a place in the program. If we don't receive the survey by June, 15th, we may need to release the spot to a waitlisted family.\n\nThank you for helping us awaken their greatness, safely and smoothly.\n\nMindvalley Youth Programs Team.", "Reference_2025_Copy": "[Reminder follow-up to #35 — same copy structure with updated deadline]", "Prep_Notification_Date": "2026-05-15"}, {"ID": "8", "Sequence": "Pre-Event Engagement", "Email_Name": "Speakers Announcement", "Audience": "All Valid Ticket Holders", "Subject_Line": "Meet the First Speakers of Mindvalley University 2026! 🎤✨", "Proposed_Send_Date": "2026-05-25", "Day_of_Week": "Monday", "Status": "Cancelled", "CTA_Type": "Link", "CTA_Description": "Event page / speaker lineup", "Notes": "First wave of speaker reveals. Include 5-10 confirmed names. Includes friend-invite P.S. | Pushed from May 18 to May 25 due to upstream replanning. | CANCELLED on 2026-06-15: speakers have been revealed via other channels (lineup pages, social media). A dedicated email would be redundant.", "Priority": "High", "Copy_2026": "Hey [First Name],\n\nThe countdown to Mindvalley University 2026 in Tallinn is on... and we're thrilled to share the first wave of extraordinary speakers joining us this July 20 – August 2.\n\nFrom visionary thinkers to transformational teachers, this lineup is designed to stretch your mind, open your heart, and elevate every area of your life — from mindset to leadership, relationships to personal transformation.\n\n🌟 Here's Your First Look at the Lineup:\n\n[Speaker 1] — [One-line bio]\n[Speaker 2] — [One-line bio]\n[Speaker 3] — [One-line bio]\n[Speaker 4] — [One-line bio]\n[Speaker 5] — [One-line bio]\n\nAnd of course, some of your most-loved Mindvalley speakers will also return to the stage:\n\n[Returning Speaker 1] — [One-line bio]\n[Returning Speaker 2] — [One-line bio]\nVishen — Founder of Mindvalley & your guide through the extraordinary\n\nAnd this is just the beginning.\n\nThis is more than a lineup. It's a movement of minds and souls coming together in one of Europe's most captivating cities. And the best part? You'll be right there in the heart of it.\n\nLet the countdown begin,\nThe Mindvalley Events Team\n\nP.S. More speakers will be announced soon — stay tuned and stay inspired. 🌍✨\n\nP.S. Got a friend who'd lose their mind over this lineup? Tag them on Instagram, forward this email, or send them their ticket directly: [Invite them to MVU 2026]", "Reference_2025_Copy": "[Jun 3, 2025 — Speakers Announcement]\nAudience: All Valid Ticket Holders\nSubject: Meet the First Speakers of Mindvalley University 2025! 🎤✨\nKey content: First wave of speakers: Brendan Kane, Roxie Nafousi, Itay Talgam, Emanuela Deyanova, Kwame Christian. Returning: Jimmy Naraine, Linda Clemons, Marie Diamond, Paul McKenna, Vishen. Framed as movement, not just lineup. Teased more announcements coming. Signed by MV Events Team.", "Prep_Notification_Date": "2026-05-18"}, {"ID": "47", "Sequence": "Pre-Event Engagement", "Email_Name": "Tribe Stage Application - Reminder May 25th", "Audience": "All adult ticket holders (No Youth Program attendee)", "Subject_Line": "A Tiny Question About the Tribe Stage 🎤", "Proposed_Send_Date": "2026-05-25", "Day_of_Week": "Monday", "Status": "Sent", "CTA_Type": "Link", "CTA_Description": "Tribe Stage application form", "Notes": "SENT via Bizzabo May 25. Second reminder follow-up — different tone (playful \"tiny question\").", "Priority": "Medium", "Copy_2026": "Hi [First Name],\n\nTiny question:\n\nIs there something you've been quietly building, teaching, healing through, practicing, or living into… that could serve the Mindvalley community?\n\nIf the answer is \"maybe,\" \"yes,\" or \"my soul just raised its hand,\" this is your invitation.\n\nThe Tribe Stage at Mindvalley U 2026 is our community-led space for members like you to host sessions in Tallinn.\n\nThink: workshops, embodiment practices, guided meditations, conscious conversations, creative experiences, meaningful stories, and ideas that make the room go, \"Ohhh, I needed that.\"\n\nYou don't need to have it all perfectly polished.\n\nYou just need a valid MVU 2026 ticket, a clear intention, and the desire to create real impact with our community.\n\nBecause at Mindvalley U, some of the most powerful moments don't come from watching transformation happen.\n\nThey come from leading it.\n\nFor some, the Tribe Stage becomes the start of something bigger within the Mindvalley ecosystem.\nFor others, it's a beautiful chance to give back, connect, and share what's alive in them.\n\nSo if something inside you is whispering yes — even shyly, from behind the curtains — we'd love to hear from you.\n\n👉 Apply for the Tribe Stage here\n\nWith love,\nThe Mindvalley Events Team", "Reference_2025_Copy": "[Tribe Stage reminder #2 — follow-up to #40 and #45]", "Prep_Notification_Date": "2026-05-18"}, {"ID": "52", "Sequence": "Pre-Event Engagement", "Email_Name": "Marta Survey - Non VIP Ticket Holders", "Audience": "Marta Survey - All NON-VIP ticket holders", "Subject_Line": "Help shape Mindvalley U 2026 (5 min)", "Proposed_Send_Date": "2026-05-27", "Day_of_Week": "Wednesday", "Status": "Sent", "CTA_Type": "Link", "CTA_Description": "Survey link", "Notes": "Marta's research initiative — survey to understand audience expectations for non-VIP holders.", "Priority": "Medium", "Copy_2026": "Hi [First Name] 💛\n\nYou just made a decision that a lot of people dream about — you're coming to Mindvalley U 2026.\n\nBefore we finalize the agenda, the teachers, the sessions, the rituals, we want to start with the most important ingredient: you.\n\nBecause Mindvalley U isn't just an event. It's the week people look back on as a turning point. And this year, we want to make sure it's designed for the exact season of life you're in right now.\n\nSo we made a short survey — 4 to 5 minutes, 8 questions. Your answers will directly shape:\n\n→  The themes and topics we prioritize\n→  The formats that will support you most\n→  The speakers and teachers we bring on stage\n→  The emotional tone and depth of the experience\n\n[  TAKE THE SURVEY  ]\n\nOptional: be part of a 15-minute interview\n\nAt the end of the survey, you can indicate if you're open to a 15-minute interview with our team. We'll invite a small number of participants to go deeper into what would make Mindvalley U 2026 truly unforgettable for you.\n\nEvery response helps us create an Mindvalley U that feels more meaningful, more magical, and more transformational, not in theory, but in your life.\n\nThank you for being part of this. Truly.\n\nWarmly,\nMindvalley Team", "Reference_2025_Copy": "[Marta initiative — research survey for Non-VIP audience]", "Prep_Notification_Date": "2026-05-20"}, {"ID": "53", "Sequence": "Pre-Event Engagement", "Email_Name": "Marta Survey - VIP Ticket Holders", "Audience": "All VIP ticket holders", "Subject_Line": "Help us design your VIP experience at MVU 2026", "Proposed_Send_Date": "2026-05-27", "Day_of_Week": "Wednesday", "Status": "Sent", "CTA_Type": "Link", "CTA_Description": "Survey link", "Notes": "Marta's research initiative — separate survey for VIP holders focused on VIP-specific needs.", "Priority": "Medium", "Copy_2026": "Hi [First Name] 💛\n\nThe VIP experience at Mindvalley U 2026 is being designed from scratch.\n\nNot from assumptions, or last year's template. From the real needs, depth preferences, and vision of the people who actually choose it; people like you.\n\nWe made a focused survey — 5 minutes, 11 questions — to understand what VIP actually means to you. Your answers will directly shape:\n\n→  The size, intimacy, and curation of VIP circles\n→  The depth and psychological safety of sessions\n→  The pacing, restoration, and nervous system support\n→  The speakers and teachers we bring into the VIP space\n→  What makes connections feel truly meaningful\n\n[  TAKE THE SURVEY  ]\n\nAt the end, you can opt into a 15-minute VIP design interview. We'll invite a small number of participants to go deeper into what would make the overall experience truly unforgettable for you.\n\nEvery response helps us create a VIP experience that feels more aligned, more magical, and more transformational, not in theory, but in your life.\n\nYou chose VIP because you want something more. Help us make sure it delivers.\n\nThank you for being part of this. Truly.\n\nWarmly,\nMindvalley Team", "Reference_2025_Copy": "[Marta initiative — research survey for VIP audience]", "Prep_Notification_Date": "2026-05-20"}, {"ID": "48", "Sequence": "Pre-Event Engagement", "Email_Name": "Tribe Stage Application - Reminder May 29th", "Audience": "Valid Ticket Holders", "Subject_Line": "Tribe Stage at MVU 2026 — One Last Reminder 🎤", "Proposed_Send_Date": "2026-05-29", "Day_of_Week": "Friday", "Status": "Sent", "CTA_Type": "Link", "CTA_Description": "Tribe Stage application form", "Notes": "SENT via Bizzabo May 29. Third reminder follow-up — audience broadened to ALL Valid Ticket Holders (including Youth Program parents).", "Priority": "Medium", "Copy_2026": "Hi [First Name],\n\nSome of the most powerful moments at Mindvalley U don't happen because someone had the perfect title, the perfect pitch, or the perfect plan.\n\nThey happen because someone chose to share something real.\n\nThat's the spirit behind the Tribe Stage — a community-led space at Mindvalley U 2026 where members can host sessions that inspire, connect, and create meaningful impact.\n\nWe're inviting MVU 2026 ticket holders to apply to lead a session in Tallinn.\n\nYour session could be a workshop, guided meditation, embodiment practice, conscious conversation, storytelling experience, or a fresh idea you feel called to bring to our community.\n\nYou don't need to have everything figured out perfectly.\n\nYou just need a clear intention, a meaningful offering, and the desire to serve the room.\n\nBecause your story, your work, or your practice may be exactly what another member needs to experience.\n\nIf you've been considering applying, we'd love to hear from you.\n\n👉 Apply for the Tribe Stage here\n\nWith love,\nThe Mindvalley Events Team", "Reference_2025_Copy": "[Tribe Stage reminder #3 — broader audience including Youth Program parents]", "Prep_Notification_Date": "2026-05-22"}, {"ID": "54", "Sequence": "Pre-Event Engagement", "Email_Name": "Marta Survey - Non VIP Ticket Holders (Reminder)", "Audience": "Marta Survey - All NON-VIP ticket holders", "Subject_Line": "Quick reminder: MVU 2026 survey (5 min)", "Proposed_Send_Date": "2026-06-02", "Day_of_Week": "Tuesday", "Status": "Sent", "CTA_Type": "Link", "CTA_Description": "Survey link", "Notes": "Marta's research initiative reminder — Non-VIP segment.", "Priority": "Medium", "Copy_2026": "Hi [First Name] 💛\n\nA few days ago, we sent a short survey about Mindvalley U 2026 and wanted to gently bring it back to the top of your inbox.\n\nIf you haven't had the chance to fill it out yet, we would still truly love to hear from you.\n\nThe survey takes around 4–5 minutes, and your answers will help us shape everything from themes and formats to the emotional atmosphere of the event itself.\n\n[  TAKE THE SURVEY  ]\n\nWe're genuinely building this year's Mindvalley U with the community, not just for the community.\nAnd we'd love to hear your voice in it.\n\nWarmly,\nMindvalley Team", "Reference_2025_Copy": "[Marta survey reminder — Non-VIP]", "Prep_Notification_Date": "2026-05-26"}, {"ID": "55", "Sequence": "Pre-Event Engagement", "Email_Name": "Marta Survey - VIP Ticket Holders (Reminder)", "Audience": "All VIP ticket holders", "Subject_Line": "Quick reminder: VIP experience survey", "Proposed_Send_Date": "2026-06-02", "Day_of_Week": "Tuesday", "Status": "Sent", "CTA_Type": "Link", "CTA_Description": "Survey link", "Notes": "Marta's research initiative reminder — VIP segment.", "Priority": "Medium", "Copy_2026": "Hi [First Name] 💛\n\nA few days ago, we sent a short survey about Mindvalley U 2026 and wanted to gently bring it back to the top of your inbox.\n\nIf you haven't had the chance to fill it out yet, we would still truly love to hear from you.\n\nThe survey takes around 4–5 minutes, and your answers will help us shape everything from themes and formats to the emotional atmosphere of the event itself.\n\n[  TAKE THE SURVEY  ]\n\nWe're genuinely building this year's Mindvalley U with the community, not just for the community.\nAnd we'd love to hear your voice in it.\n\nWarmly,\nMindvalley Team", "Reference_2025_Copy": "[Marta survey reminder — VIP]", "Prep_Notification_Date": "2026-05-26"}, {"ID": "9", "Sequence": "Pre-Event Engagement", "Email_Name": "Style Guide Announcement", "Audience": "All Valid Ticket Holders", "Subject_Line": "Ready for the Magic? Your Mindvalley U 2026 Party Guide is Here 💃", "Proposed_Send_Date": "2026-06-08", "Day_of_Week": "Monday", "Status": "Cancelled", "CTA_Type": "Link", "CTA_Description": "Style Guide PDF download", "Notes": "Party themes, dress codes, venues in Tallinn. Includes Magic Multiplies friend-invite mini-section. | Moved from Friday June 5 to Monday June 8 (no Friday/weekend sends). | CANCELLED on 2026-06-15: strategy changed to serial party reveals (Party & Social Calendar Reveal, Week 1/2 Theme Reveals, Style Guide Reveal). Standalone Style Guide no longer needed.", "Priority": "High", "Copy_2026": "Hey [First Name],\n\nEvery great story has moments you never forget. At Mindvalley U 2026, those moments won't just happen in the sessions or the workshops...\n\nThey'll come alive under the Baltic summer sky, in historic courtyards, on rooftop terraces, and beside strangers who become family.\n\nTo help you fully step into the Mindvalley U experience, we've created something special: Your official Style Guide — a curated map of where to go, what to wear, and how to show up for the most magical nights of the year.\n\n✨ Week 1 Highlights (July 20-25):\n\n🪩 Monday, July 20 — Welcome Social\n[Venue TBD], 7 PM – 11 PM\nA warm gathering to meet your fellow tribe members. Casual, light, joyful — dress however you feel most like YOU.\n\n🌟 Thursday, July 23 — [VIP Party Theme TBD] (VIP & First Class only)\n[Venue TBD], 9 PM – 1 AM\nAn exclusive evening designed for connection and celebration. Dress code details in the Style Guide.\n\n⚡ Saturday, July 25 — [Main Party Theme TBD]\n[Venue TBD], 8:30 PM – 2 AM\nThe main party of Week 1. Bold, electric, unforgettable.\n\n🌿 Week 2 Highlights (July 27 - August 1):\n\n🪩 Monday, July 27 — Welcome Social\n[Venue TBD], 7 PM – 11 PM\nCasual, light, joyful — come as you are and be ready to mingle.\n\n☀️ Thursday, July 30 — [VIP Party Week 2 Theme TBD] (VIP & First Class only)\n[Venue TBD], 9 PM – 1 AM\nAnother magical evening exclusively for VIP & First Class guests.\n\n🎷 Saturday, August 1 — [Closing Party Theme TBD]\n[Venue TBD], 8:30 PM – 2 AM\nThe grand finale. Go all in. Sparkle hard. Dance harder.\n\n💫 And for our youngest tribe members?\nWe love seeing families celebrate together — and your kids are welcome to join the fun! For Saturday main parties, we'll have a dedicated kids' area and activities. VIP parties are designed mainly for adults (recommended 16+).\n\n💃 The Magic Multiplies When Shared\n\nEvery unforgettable night at MVU is even better with the people you love.\n\nWhether it's a partner you want to dance with under the Baltic stars, family who hasn't seen this version of you in a while, or a friend who needs this — bring your tribe with you.\n\n👉 [Send them their ticket to MVU 2026]\n\n📎 All the event details, times, venues, and dress inspo live inside your Style Guide:\n\n👉 [Click here to access the full Mindvalley U 2026 Style Guide PDF]\n\nThese events aren't just social — they're transformational. They're the heartbeat of Mindvalley U. And how you show up matters. Not to impress, but to express.\n\nLooking forward to seeing you there!\n\nWith love,\nMindvalley U Team\n\nP.S. Remember:\n✔️ Bring your MVU wristband to every event\n✔️ Bring cash/card for food & drinks at the venues\n✔️ Come ready to connect, move, laugh, and be seen ✨", "Reference_2025_Copy": "[Jun 20, 2025 — Style Guide Announcement]\nAudience: All Valid Ticket Holders\nSubject: Ready for the Magic? Your Mindvalley U 2025 Party Guide is Here 💃\nKey content: Launched Style Guide PDF. Week 1: Welcome Social at Tolhuistuin, On Cloud 9 at A'DAM Tower (VIP), Into the Future at Amaze. Week 2: Welcome Social, Summer by the Park at Vondelpark (VIP), Roaring 1920s Closing at Het Sieraad. Kids welcome at main parties (dedicated area). VIP parties recommended 16+. Signed by MV U Team.", "Prep_Notification_Date": "2026-06-01"}, {"ID": "51", "Sequence": "Pre-Event Engagement", "Email_Name": "Week 1 Party Theme Reveal", "Audience": "All adult ticket holders (No Youth Program attendee)", "Subject_Line": "Your other suitcase is calling… Mindvalley U Socials & Parties Revealed 🎉", "Proposed_Send_Date": "2026-06-09", "Day_of_Week": "Tuesday", "Status": "Sent", "CTA_Type": "Soft", "CTA_Description": "Teaser — style guide coming soon", "Notes": "SENT via Bizzabo June 9. Second email in the party reveal series. Reveals Week 1 themes by night.", "Priority": "High", "Copy_2026": "Hi [First Name],\n\nRemember when we told you to pack a second suitcase? We weren't kidding.\n\nAt Mindvalley U, we don't do \"networking events.\" We create worlds.\n\nFor one night, you might be wandering an entire city district with hundreds of strangers — all wearing the same color, all finding each other through the streets. Next, you're stepping into a hidden world of mystery and elegance. You stop performing \"yourself\" and you start playing. It's in that play that you find the real you.\n\nHere are the worlds we're opening up for you in Week 1:\n\n🔵 Monday, July 20th — Blue Block Party | Rotermanni Quarter\n\nThis isn't a party in a venue. The venue is an entire district of Tallinn. Hundreds of us, all in blue, moving through the city, creating a current of connection. The city is our campus.\n\n🌙 Monday, July 20th — ALT Monday | Secret Location\n\nAnd when the Block Party ends… the night is just getting started. A secret location drops on your phone at 9PM. By 10PM, you're somewhere unexpected — music, energy, and something gloriously alive until 1AM. Keep your phone charged.\n\n🎭 Thursday, July 23rd — Midnight Cabaret | Manna La Roosa\n(First Class & VIP ticket holders)\n\nFor our First Class & VIP tribe, we step into a hidden world of mystery and elegance. A place where the performances aren't just on a stage, but in the moments between conversations.\n\n🖤 Friday, July 24th — Black Block Party | Telliskivi Quarter\n\nNew day, new color, new location, five curated spots. We descend on Telliskivi, Tallinn's creative heart, a canvas of street art and conversation. A symbol of new beginnings.\n\n🐇 Saturday, July 25th — Marvellous Wonderland | PROTO Invention Factory\n\nOur official opening celebration. We're taking over an old invention factory and turning it upside down. Think Alice in Wonderland meets steampunk meets... well, you'll just have to see. This is where the adventure truly begins.\n\nStart dreaming. Start plotting. The style guide is coming soon.\n\nNext week, we'll tell you about Week 2. It only gets better.\n\nWith excitement,\nThe Mindvalley U Team", "Reference_2025_Copy": "[Party reveal series email #2 — Week 1 themes per night]", "Prep_Notification_Date": "2026-06-02"}, {"ID": "7", "Sequence": "Pre-Event Engagement", "Email_Name": "Hotel Discounts in Tallinn", "Audience": "Valid Ticket Holders", "Subject_Line": "Exclusive Hotel Deals for MVU 2026 in Tallinn 🏨", "Proposed_Send_Date": "2026-06-15", "Day_of_Week": "Monday", "Status": "Sent", "CTA_Type": "Link", "CTA_Description": "Hotel deals page", "Notes": "SENT via Bizzabo Jun 15. Reframed from original Plan Your Trip — accommodation offers focus with warm storytelling.", "Priority": "High", "Copy_2026": "Hey Álvaro,\n\nOne of the most beautiful parts of Mindvalley U is that for a few unforgettable weeks, a new city becomes more than a destination.\n\nIt becomes your campus.\nYour playground.\nYour meeting point for deep conversations, spontaneous dinners, morning walks, new friendships… and the occasional \"Wait, did that workshop just rewire my entire life?\" moment.\n\nAnd this year, that city is Tallinn.\n\nTo make your stay smoother, we've curated a selection of special accommodation offers for Mindvalley U attendees — with options across different budgets, styles, and locations.\n\nWhether you're looking for something simple and central, a serviced apartment with more independence, a cozy hotel stay, or a more premium experience to fully treat yourself, you'll find a range of exclusive Mindvalley U rates and discounts available during the event dates.\n\nThink of it as your home base for transformation.\n\nA place to rest after a day of workshops.\nA quiet corner to integrate your insights.\nA cozy launchpad before heading out to meet your tribe again.\n\nBecause at Mindvalley U, where you stay matters less than how you feel while you're there: grounded, comfortable, connected, and ready for everything this experience will bring.\n\nYou can explore the full list of accommodation offers, rates, booking instructions, promo codes, and availability details here:\n\n🏡 Click here to explore Mindvalley U accommodation offers\n\nA gentle n week, a new color, a new tribe. We descend on Rotermanni — where industrial heritage meets modern city life, and strangers become a tribe. A symbol of new beginnings. Wear white and meet your tribe.\n\n🌙 Monday, July 27th — ALT Monday | Secret Location\n\nIt's back. And somehow, it hits even harder the second time. A new secret location. The same energy. More of the tribe.\n\n🌊 Thursday, July 30th — Summer by the Bay | Lillepaviljon\n(First Class & VIP ticket holders)\n\nAn exclusive night for our First Class & VIPs on the water's edge. Think Nordic coastal calm meets Mediterranean warmth. The kind of evening that lingers long after the 10:30 PM sunset.\n\n🇪🇪 Friday, July 31st — Estonia Block Party | Telliskivi Quarter\n\nBlue, Black, or White — or all three. We unite in the colors of the Estonian flag for one final night across Telliskivi Quarter. One city. One tribe. One last time.\n\n🌿 Saturday, August 1st — Nordic Summer Soirée | Estonian Open Air Museum\n\nOur grand finale. We're taking you out of the city and into nature, to an open-air museum that becomes our private village. A night of folk-tribal beats, bohemian chic, and celebrating the journey under the vast Estonian sky.\n\nThis is how we close Mindvalley U. Not with a goodbye — but with a \"see you soon.\"\n\nAnd to help you arrive prepared, dressed, styled, and fully in the spirit of every celebration, we've created your Official Party Guide 🎉\n\nClick the button below and you'll find the themes, dress codes, details, and little things worth knowing before each gathering.\n\nWith excitement,\nThe Mindvalley U Team", "Reference_2025_Copy": "[Party reveal series email #3 — Week 2 themes per night. Sent TOMORROW.]", "Prep_Notification_Date": "2026-06-09"}, {"ID": "2", "Sequence": "Pre-Event Engagement", "Email_Name": "About Tallinn", "Audience": "All Valid Ticket Holders", "Subject_Line": "Why Tallinn Is the Perfect City for Your Next Big Transformation 🇪🇪", "Proposed_Send_Date": "2026-06-18", "Day_of_Week": "Thursday", "Status": "To Do", "CTA_Type": "Forward / Share", "CTA_Description": "P.S. friend-invite link only — no hard CTA in body (storytelling email)", "Notes": "Originally scheduled Feb 27, then May 4 — both missed. Repositioned to Thu Jun 18 as storytelling/anticipation piece before the Style Guide reveal week.", "Priority": "High", "Copy_2026": "Hey [First Name],\n\nClose your eyes for a second and picture this...\n\nYou're walking through the cobblestone streets of Tallinn's medieval Old Town, past towers that have stood for centuries, as the golden light of a Baltic summer evening wraps around you. The air carries the hum of cafes, the distant sound of live music, and a quiet energy that feels like possibility itself.\n\nNow imagine that instead of just visiting, you're here for something extraordinary — a two-week deep dive into your greatest potential.\n\nThis is Mindvalley University 2026, and it takes place from July 20 to August 2 in the heart of Tallinn, Estonia.\n\nFor two unforgettable weeks, Tallinn becomes your playground for transformation.\n\nHere's why you need to be there.\n\n🏰 Learn, Explore, and Grow in One of Europe's Best-Kept Secrets\n\nTallinn isn't just another event location — it's an experience in itself.\n\nA city where medieval meets digital — Tallinn is one of the most digitally advanced cities on Earth, yet its Old Town is a UNESCO World Heritage Site. It's where ancient wisdom and innovation coexist — the perfect setting to expand your mind and vision for the future.\n\nA classroom without walls — One moment, you're in a masterclass with a world-class teacher. Next, you're exploring the winding alleys of the Old Town or gazing across the Baltic Sea from Pirita Beach. This isn't just learning — it's a full-body immersion into new ideas.\n\nFrom sunrise meditations to unforgettable nights — Whether you're diving deep into a talk on human potential, networking with brilliant minds over dinner, or dancing under the white nights of a Baltic summer, every moment at MVU is designed for transformation.\n\n🌟 Not a Conference. Not a Retreat. A Total Life Upgrade.\n\nChoose Your Own Adventure: Stay for a weekend, a week, or the full two-week experience.\nLearn from the Best: Our speaker lineup is filled with global thought leaders in business, relationships, biohacking, spirituality, and more.\nJoin a Global Tribe: You'll connect with entrepreneurs, creatives, changemakers, and seekers from over 60 countries.\n\n👨‍👩‍👧‍👦 The Only Event of Its Kind That Welcomes Your Family\n\nIf you're a parent, this is your chance to share the journey of personal growth with your kids. A full curriculum for Kids & Teens, global experiences, and friendships that last a lifetime.\n\nThis summer, you're not just visiting a city. You're stepping into a chapter you'll remember for years.\n\nWe can't wait to welcome you to Tallinn.\n\nSee you under the Baltic sky,\nThe Mindvalley Events Team\n\nP.S. Tallinn isn't the kind of city you discover alone. Know someone who'd light up at the thought of this? Forward them this email — or share the link directly: [Send a friend to MVU 2026]", "Reference_2025_Copy": "[Mar 13, 2025 — About Amsterdam]\nAudience: MV InfoMailer Database\nSubject: Why Amsterdam is the Perfect City for Your Next Big Transformation\nKey content: Painted a vivid picture of Amsterdam (canals, bridges, sunsets). Positioned the city as part of the transformation experience. Highlighted: creativity hub, classroom without walls, sunrise-to-nightlife experience. Family-friendly angle with Kids & Teens programs. Urgency: early pricing expiring, limited spots. Signed by Mindvalley Events.", "Prep_Notification_Date": "2026-06-11"}, {"ID": "10", "Sequence": "Pre-Event Engagement", "Email_Name": "Lineup Update", "Audience": "All Valid Ticket Holders", "Subject_Line": "New Speakers Just Announced — This Summer in Tallinn Will Change Everything ✨", "Proposed_Send_Date": "2026-06-22", "Day_of_Week": "Monday", "Status":
