name: Update Week Field

on:
  workflow_dispatch:
    inputs:
      assignments:
        description: "Semicolon-separated <registration id>=<W1|W2|BOTH>"
        required: true
      dry_run:
        description: "Dry run (print current vs proposed, change nothing)"
        type: choice
        options: ["true", "false"]
        default: "true"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Update week field
        env:
          BIZZABO_CLIENT_ID:     ${{ secrets.BIZZABO_CLIENT_ID }}
          BIZZABO_CLIENT_SECRET: ${{ secrets.BIZZABO_CLIENT_SECRET }}
          BIZZABO_ACCOUNT_ID:    "129966"
          BIZZABO_EVENT_ID:      "754649"
          ASSIGNMENTS:           ${{ inputs.assignments }}
          DRY_RUN:               ${{ inputs.dry_run }}
        run: python set_week.py
