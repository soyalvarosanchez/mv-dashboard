anize dinners, co-working sessions, or sunrise walks along the Baltic coast.\n✅ Host your own meetups: Browse community-led events and create your own gatherings around Tallinn.\n\nAlready used Six before? You'll be added to the Mindvalley U 2026 network automatically.\n\nNew to the app? Keep an eye on your inbox — once you've been added to the network, we'll send you an exclusive invite code and setup instructions.\n\nHow to download the app:\n\n📱 iOS: [Link]\n📱 Android: [Link]\n\nWith Six in your pocket, Mindvalley U becomes more than an event — it becomes your new tribe, your new Tallinn family, and your next level.\n\nSee you soon under the Baltic skies,\nMindvalley U Team\n\n*Please note that the latest version is required to experience all the new features of the app.", "Reference_2025_Copy": "[Jul 25, 2025 — SIX App]\nAudience: All Valid Ticket Holders\nSubject: Your Access to the Mindvalley U Community: Introducing the SIX App\nKey content: Introduced Six networking app. Features: matching algorithm, pre-event connections, chat, community-led meetups. Existing users auto-added to 2025 network. New users get invite code. iOS + Android links. Framed as 'digital passport to the tribe'. Signed by MV U Team.", "Prep_Notification_Date": "2026-06-24"}, {"ID": "66", "Sequence": "Pre-Event Engagement", "Email_Name": "Kids & Teens Waitlist Announcement - Batch 2", "Audience": "Kids & Teens Waitlist - Batch 2", "Subject_Line": "Kids & Teens Tickets Update — Waitlist Release", "Proposed_Send_Date": "2026-07-01", "Day_of_Week": "Wednesday", "Status": "Sent", "CTA_Type": "Link", "CTA_Description": "Ticket availability page", "Notes": "SENT via Bizzabo 2026-07-01. Waitlist release batch 2. Small batch (~10 recipients).", "Priority": "Medium", "Copy_2026": "Hi Álvaro,\n\nWe wanted to share a small update with you.\n\nA limited number of additional Kids and Teens tickets for Mindvalley U 2026 has just become available.\n\nBecause you joined the waitlist, you're receiving this email as part of our waitlist release process. We're opening access in small batches, based on the order in which families contacted us.\n\nPlease note that availability is still very limited, and tickets can't be held individually.\n\nSo if you're still interested in adding a Kids or Teens ticket to your Mindvalley U experience, you can check availability and book through the link below.\n\nIf tickets are still available when you visit the page, you'll be able to complete your booking there.\n\nWith love,\nThe Mindvalley U Team", "Reference_2025_Copy": "[Kids & Teens Waitlist release - Batch 2. Identical copy across all 3 batches.]", "Prep_Notification_Date": "2026-06-24"}, {"ID": "67", "Sequence": "Pre-Event Engagement", "Email_Name": "Kids & Teens Waitlist Announcement - Batch 3", "Audience": "Kids & Teens Waitlist - Batch 3", "Subject_Line": "Kids & Teens Tickets Update — Waitlist Release", "Proposed_Send_Date": "2026-07-06", "Day_of_Week": "Monday", "Status": "Sent", "CTA_Type": "Link", "CTA_Description": "Ticket availability page", "Notes": "SENT via Bizzabo 2026-07-06. Waitlist release batch 3. Small batch (~10 recipients).", "Priority": "Medium", "Copy_2026": "Hi Álvaro,\n\nWe wanted to share a small update with you.\n\nA limited number of additional Kids and Teens tickets for Mindvalley U 2026 has just become available.\n\nBecause you joined the waitlist, you're receiving this email as part of our waitlist release process. We're opening access in small batches, based on the order in which families contacted us.\n\nPlease note that availability is still very limited, and tickets can't be held individually.\n\nSo if you're still interested in adding a Kids or Teens ticket to your Mindvalley U experience, you can check availability and book through the link below.\n\nIf tickets are still available when you visit the page, you'll be able to complete your booking there.\n\nWith love,\nThe Mindvalley U Team", "Reference_2025_Copy": "[Kids & Teens Waitlist release - Batch 3. Identical copy across all 3 batches.]", "Prep_Notification_Date": "2026-06-29"}, {"ID": "69", "Sequence": "Pre-Event Engagement", "Email_Name": "Whatsapp Community Link", "Audience": "Valid Ticket Holders", "Subject_Line": "Join the official Mindvalley U WhatsApp community 💬", "Proposed_Send_Date": "2026-07-07", "Day_of_Week": "Tuesday", "Status": "Sent", "CTA_Type": "Link", "CTA_Description": "WhatsApp community join link", "Notes": "SENT via Bizzabo Jul 7. Official WhatsApp community for announcements, updates and reminders before/during event.", "Priority": "High", "Copy_2026": "Hi Álvaro,\n\nMindvalley U is getting closer… and before the magic officially begins, we want to make sure you're connected to the right place.\n\nWe've created an official WhatsApp community for Mindvalley U attendees.\n\nThis is where we'll share official event announcements, important updates, key reminders, and anything you'll need to know before and during the experience.\n\nThink of it as your little digital compass for Mindvalley U.\n\nNo noise.\nNo missed updates.\nNo wondering, \"Wait… where did I see that again?\" while juggling 17 browser tabs and a matcha latte.\n\n💬 Join the official WhatsApp community here\n\nWe recommend joining now so you don't miss any important updates as we get closer to the event.\n\nWe're so excited to experience Mindvalley U with you — the learning, the friendships, the spontaneous conversations, and those beautiful little moments that somehow become lifelong memories.\n\nWith love,\nThe Mindvalley U Team\n\nP.S. This WhatsApp community will be used for official event announcements, so please join using the number you'll have access to during Mindvalley U.", "Reference_2025_Copy": "[New for 2026 — WhatsApp community launch. In 2025 this was done differently (channel joined via SIX app or Attendee Guide).]", "Prep_Notification_Date": "2026-06-30"}, {"ID": "58", "Sequence": "Pre-Event Engagement", "Email_Name": "Parties & Social - Artists Reveal - Week 1", "Audience": "Valid Ticket Holders", "Subject_Line": "Artist Reveal: Week 1 Nights of Mindvalley U Are Coming Alive 🎶", "Proposed_Send_Date": "2026-07-09", "Day_of_Week": "Thursday", "Status": "Sent", "CTA_Type": "Soft", "CTA_Description": "Artist showcase — soft CTA", "Notes": "Reveals DJs/performers for Week 1 parties. Originally planned Jun 9 in doc, repositioned to Tue Jun 23. | Repositioned per user instruction to Thu Jul 9 | SENT via Bizzabo (confirmed). Name/audience aligned to Bizzabo.", "Priority": "Medium", "Copy_2026": "Hi [First Name],\n\nMindvalley U 2026 in Tallinn is now just weeks away.\n\nSoon, thousands of people from around the world will gather here — to learn, connect, celebrate, and experience the kind of moments that stay with you long after summer ends.\n\nThe days will expand you. But the nights?\n\nThe nights will pull you into entirely different worlds.\n\nToday, we're revealing the artists, performers, and energy behind some of the most unforgettable evenings of Week 1.\n\nHere's what awaits:\n\n🌙 ALT Monday\nJuly 20 | Secret Location\n\nThe Blue Block Party wraps at 11PM… but the night is just getting started. A secret location drops on your phone. By 11PM, hundreds of you arrive somewhere in the city — music, energy, and something alive until 2AM.\n\nDresscode: Keep your Blue on from the Block Party.\n\nYour entertainers for the evening:\n[ADD ARTIST VISUAL]\n\n🎭 Midnight Cabaret — VIP Party\nJuly 23 | Manna La Roosa\n(First Class & VIP ticket holders)\n\nMidweek, we step behind the velvet curtain for a night where mystery and elegance intertwine. Subtle performances and fleeting cabaret moments inside Manna La Roosa's theatrical interior.\n\nDresscode: Cabaret Noir\n\nYour entertainers for the evening:\n[ADD ARTIST VISUAL]\n\n🐇 Marvellous Wonderland\nJuly 25 | PROTO Invention Factory\n\nThe official opening celebration. We transform the PROTO Invention Factory into a Wonderland where reality bends and imagination takes over. Inspired by Alice in Wonderland — playful illusions, unexpected details, and curious moments at every turn.\n\nDresscode: Alice in Wonderland inspired\n\nYour entertainers for the evening:\n[ADD ARTIST VISUAL]\n\nThis is just the first glimpse of what we have planned for you.\n\nSee you in Tallinn soon,\nThe Mindvalley U Team", "Reference_2025_Copy": "[Copy from MVU 2026 Party customer comms doc — Jun 9 Week 1 Artists Reveal]", "Prep_Notification_Date": "2026-07-02"}, {"ID": "12", "Sequence": "Pre-Event Engagement", "Email_Name": "Sharing Upgrade Form", "Audience": "Valid Ticket Holders", "Subject_Line": "Want to upgrade your Mindvalley U experience?", "Proposed_Send_Date": "2026-07-10", "Day_of_Week": "Friday", "Status": "Sent", "CTA_Type": "Link", "CTA_Description": "Upgrade request form (tier upgrade to VIP/FC, duration extension, or both)", "Notes": "SENT via Bizzabo Jul 10. Real copy restored Jul 16 (previous entry had outdated draft). General upgrade-request email: tier upgrade to VIP/First Class, duration extension, or both. Upgrade not confirmed until payment + official confirmation.", "Priority": "Medium", "Copy_2026": "Hi [First Name],\n\nYou're already joining us for Mindvalley U 2026 — and that means you're stepping into an experience designed for deep growth, powerful connections, unforgettable conversations, and those magical \"how did I just meet my new best friend in a coffee line?\" moments.\n\nAnd now, you have the opportunity to elevate your experience even further.\n\nWe're opening upgrade requests for attendees who would like to explore one of the following options, subject to availability:\n\n• Upgrade your ticket tier to VIP or First Class\n• Extend your ticket duration to a longer available access period\n• Combine both options — for example, upgrade from a 3-day or 1-week General Admission ticket to a longer VIP or First Class ticket\n\nTo request your upgrade, simply fill out this form:\n\n👉 Click here to request your upgrade\n\nVery important: your upgrade is not confirmed until payment has been completed and you have received an official confirmation email from the Mindvalley team.\n\nSo please don't update your inner VIP status just yet. Almost. But not quite. 😉\n\nIf this feels aligned, click the button below\n\nWe can't wait to welcome you to Mindvalley U 2026 — whichever version of the experience you choose.\n\nWith love,\n\nThe Mindvalley U Team\n\nP.S. Upgrade availability may be limited, so we recommend submitting your request as soon as possible if this is something you'd love to explore.\n\n\"Sometimes the next level begins with one small yes.\"\n\n[BUTTON: Upgrade your ticket]", "Reference_2025_Copy": "[Jul 23, 2025 — VIP Upgrade]\nAudience: All Valid Ticket Holders\nSubject: Your First-Class Invitation Is Still Open\nKey content: Gentle upsell nudge for First-Class upgrade. Perks listed: private speaker dinner, front row, exclusive parties, personal concierge. Urgency: handful of seats left. Link to request form. Signed by MV U Team.", "Prep_Notification_Date": "2026-07-03"}, {"ID": "16", "Sequence": "Pre-Event Engagement", "Email_Name": "The 3 Apps For Mindvalley U", "Audience": "Valid Ticket Holders", "Subject_Line": "The 3 apps that will make Mindvalley U effortless", "Proposed_Send_Date": "2026-07-13", "Day_of_Week": "Monday", "Status": "Sent", "CTA_Type": "Soft", "CTA_Description": "No hard CTA — informational overview of 3 apps", "Notes": "Moved from Thu Jul 9 to Mon Jul 13. Reframed from \"Agenda App\" solo to a comprehensive intro of 3 apps: Agenda App + WhatsApp Community + Finerminds (new Mindvalley connection app, replacing SIX from 2025). | SENT via Bizzabo (confirmed). Name/audience aligned to Bizzabo.", "Priority": "High", "Copy_2026": "Hi [Name],\n\nMindvalley U isn't just an event.\n\nIt's a little city within a city: sessions, workshops, unexpected conversations, moments of expansion, new friends, parties, breakthroughs… and probably at least one \"Wait, which room was that in?\" said while holding coffee.\n\nTo help you move through the experience with more clarity, connection, and calm, we'll be using 3 main apps during Mindvalley U.\n\nKeep this email close. Think of it as your little digital compass.\n\n1. Agenda App — your daily guide\n\nThis is where you'll find the event agenda: sessions, timings, speakers, workshops, and everything you need to know about what's happening, when it's happening, and where you need to be.\n\nUse it to plan your days, choose your sessions, and make sure you don't accidentally miss the workshop that later becomes \"the thing everyone is talking about.\"\n\n2. WhatsApp Community — your official announcement channel\n\nOur WhatsApp Community will be used for official Mindvalley U updates and important event notifications.\n\nThink of it as your event \"push notifications\" channel — the place where we'll share timely updates, reminders, schedule changes, and anything you need to know in real time.\n\nIt's not where the magic happens. It's where we make sure you don't miss the magic.\n\n3. Finerminds — your connection app\n\nFinerminds is Mindvalley's new app designed to help you meet like-minded people from the community.\n\nThis is where you can discover interesting people, connect with attendees who share similar passions, and start conversations that may turn into friendships, collaborations, masterminds… or simply a wonderful coffee with someone who \"gets it.\"\n\nBecause yes, the sessions will be powerful.\n\nBut often, the person sitting next to you becomes part of the transformation too.\n\nSo before Mindvalley U begins, please make sure you have access to all 3:\n\n🧭 Agenda App — for your schedule\n📣 WhatsApp Community — for official updates\n🤝 Finerminds — for meeting your tribe\n\nWe'll share more details soon on how to access each one.\n\nFor now, just know this: we're setting up everything we can to help you feel informed, connected, and beautifully at home from the moment you arrive.\n\nSee you soon at Mindvalley U.\n\nAnd remember: the best connections usually begin with a slightly awkward \"Hi, is this seat taken?\"", "Reference_2025_Copy": "[Jul 29, 2025 — Agenda App]\nAudience: All Valid Ticket Holders\nSubject: Here's Your Agenda App for Mindvalley U ✨\nKey content: Launched agenda app (mvuapp.mindvalley.com). Features: full schedule for all age groups, speaker details, mobile + web optimized. First load may be slow. Referenced Attendee Guide for more info. Signed by MV U Team.", "Prep_Notification_Date": "2026-07-06"}, {"ID": "17", "Sequence": "Pre-Event Engagement", "Email_Name": "Impact Survey", "Audience": "All Past Event Attendees", "Subject_Line": "Did You Find Love at a Mindvalley Event? ✨", "Proposed_Send_Date": "2026-07-13", "Day_of_Week": "Monday", "Status": "Cancelled", "CTA_Type": "Link", "CTA_Description": "Survey link (Airtable form)", "Notes": "Collect impact stories from past attendees. | CANCELLED on 2026-07-08: User decision — not relevant for this cycle.", "Priority": "Low", "Copy_2026": "Hey [First Name],\n\nDid you find love at a Mindvalley event?\n\nDid you meet someone who became a best friend, a co-founder, a mentor — or maybe your soulmate?\n\nDid you walk away with a deeper sense of purpose, or a breakthrough that changed your path?\n\nIf you've ever attended a Mindvalley event — from A-Fest to Summit to Mindvalley U — you know it's more than just personal growth.\n\nIt's a portal into a life that's more aligned. More expansive. More connected.\n\nAnd sometimes... that simple decision to attend changes everything.\n\nThat's why we're asking for 60 seconds of your time to share your experience with us. We're collecting real, powerful data about what actually happens at our events — and your story matters more than you think.\n\n👉 Click here to fill out our Impact Survey.\n\nYour answers could help us show the world what this community is really about.\n\nNot just transformation, but connection, purpose, and real-world magic.\n\nThank you for being part of this journey — and for taking a moment to reflect on how far we've come together.\n\nWith gratitude,\nMindvalley Events Team", "Reference_2025_Copy": "[Jul 31, 2025 — Impact Survey]\nAudience: All past event attendees\nSubject: Did You Find Love at a Mindvalley Event?✨\nKey content: Emotional hook about connections made at events. Asked for 60-second survey about impact of attending. Framed as collecting real data about community. Airtable form link. Signed by MV Events Team.", "Prep_Notification_Date": "2026-07-06"}, {"ID": "59", "Sequence": "Pre-Event Engagement", "Email_Name": "Parties & Social - Artists Reveal - Week 2", "Audience": "Valid Ticket Holders", "Subject_Line": "Artist Reveal: Week 2 Nights of Mindvalley U Are Coming Alive 🎶", "Proposed_Send_Date": "2026-07-14", "Day_of_Week": "Tuesday", "Status": "Sent", "CTA_Type": "Link", "CTA_Description": "Style Guide PDF link", "Notes": "Reveals DJs/performers for Week 2 parties. Originally planned Jun 16 in doc, repositioned to Thu Jun 25. | Repositioned per user instruction to Tue Jul 14 | SENT via Bizzabo (confirmed). Name/audience aligned to Bizzabo.", "Priority": "Medium", "Copy_2026": "Hi [First Name],\n\nSomething shifts during Week 2 of Mindvalley U.\n\nThe conversations become deeper. And the nights begin to feel less like events… and more like shared memories unfolding in real time.\n\nToday, we're revealing the artists, performers, and experiences behind the Week 2 parties and socials of Mindvalley U 2026.\n\nHere's what awaits:\n\n🌙 ALT Monday\nJuly 27 | Secret Location\n\nAt 10PM your phone buzzes with a secret location. By 11PM, hundreds of you, all in White, arrive at a hidden space somewhere in the city. Music starts, energy builds, and the night becomes something unexpected, social, and alive until 2AM.\n\nDresscode: Keep your White on from the Block Party.\n\nYour entertainers for the evening:\n[ADD ARTIST VISUAL]\n\n🌊 Summer by the Bay — VIP Party\nJuly 30 | Lillepaviljon\n(First Class & VIP ticket holders)\n\nAn exclusive evening on the water's edge where Nordic coastal calm meets Mediterranean warmth. Golden light, soft breezes, and a tribe of extraordinary people gathered in one of Tallinn's most beautiful waterfront settings.\n\nDresscode: Coastal Summer Chic\n\nYour entertainers for the evening:\n[ADD ARTIST VISUAL]\n\n🌿 Nordic Summer Soirée\nAugust 1 | Estonian Open Air Museum\n\nWe close Mindvalley U 2026 with a midsummer-inspired gathering under open skies. Estonian heritage, music, and summer rituals come together for one final unforgettable night, a celebration of everything we've experienced together.\n\nDresscode: Bohemian Chic\n\nYour entertainers for the evening:\n[ADD ARTIST VISUAL]\n\nStart picturing yourself there.\n\nThe music. The atmosphere. The people you haven't met yet who may somehow become part of your story.\n\n✨ The full Mindvalley U 2026 Style Guide is waiting for you here:\n👉 [Click here to access the Style Guide PDF]\n\nSee you in Tallinn,\nThe Mindvalley U Team", "Reference_2025_Copy": "[Copy from MVU 2026 Party customer comms doc — Jun 16 Week 2 Artists Reveal]", "Prep_Notification_Date": "2026-07-07"}, {"ID": "68", "Sequence": "Pre-Event Engagement", "Email_Name": "Attendees With No Weeks Selected Reminder", "Audience": "Attendees with no weeks selected", "Subject_Line": "Quick question — when are you joining us at Mindvalley U?", "Proposed_Send_Date": "2026-07-14", "Day_of_Week": "Tuesday", "Status": "Recurring", "CTA_Type": "Link", "CTA_Description": "Edit Registration link", "Notes": "RECURRING (weekly) via Bizzabo. Live — next fire Tue Jul 14, 6PM. Small audience (~66). Auto-targets attendees who haven't answered the \"when are you joining us\" question.", "Priority": "Medium", "Copy_2026": "Hi Álvaro,\n\nWe're getting closer to Mindvalley U — and the excitement is starting to feel very real.\n\nSoon, Tallinn will become home to an extraordinary tribe of students, families, creators, entrepreneurs, teachers, seekers, and beautifully curious humans from all over the world.\n\nThere's just one small thing we still need from you.\n\nWe noticed you haven't yet answered this question:\n\nWhen are you planning to join us at Mindvalley U?\n\nThis helps our team prepare your experience more smoothly — from community moments and event flow to making sure we know when to expect your lovely face in the room.\n\nSo could you take a few seconds to update your information?\n\n👇 Click the button below to update your Mindvalley U details.\n\nWhen you click the button below, you'll land on your ticket page. Please select \"Edit Registration\", complete the missing field \"When are you joining us?\", and click Save. This will make sure your Mindvalley U registration is fully up to date.\n\nIt's quick. It's helpful. And it saves us from making mysterious spreadsheets with question marks next to your name. Nobody wants that. Especially the spreadsheets.\n\nThank you for helping us make your Mindvalley U experience feel seamless from the moment you arrive.\n\nWe can't wait to welcome you.\n\nWith love,\nThe Mindvalley U Team\n\nP.S. The more accurately we know when you're joining us, the better we can support your experience. Tiny update, big difference.", "Reference_2025_Copy": "[Recurring weekly reminder — Live status in Bizzabo. Small dynamic audience.]", "Prep_Notification_Date": ""}, {"ID": "60", "Sequence": "Pre-Event Engagement", "Email_Name": "Style Guide Reminder", "Audience": "All Valid Ticket Holders", "Subject_Line": "Mindvalley U - You're going to want to read this before you pack 👀", "Proposed_Send_Date": "2026-07-15", "Day_of_Week": "Wednesday", "Status": "Cancelled", "CTA_Type": "Link", "CTA_Description": "Style Guide PDF link", "Notes": "Reminder to review Style Guide before packing. Originally planned Jun 23 in doc, repositioned to Tue Jun 30. | Repositioned to Wed Jul 15 as pre-packing style reminder (5 days before event) | CANCELLED on 2026-07-08: User decision — redundant given Party Guide already sent Jun 16 with #56 and Week 1 Party Calendar Reminder in #18.", "Priority": "Medium", "Copy_2026": "Hi [First Name],\n\nBy now, you've probably realized something about Mindvalley U.\n\nThis isn't just a conference.\n\nIt's two weeks of connection, transformation, spontaneity… and becoming a little more fully yourself than you've been in a long time.\n\nThe days may expand your mind.\nBut the nights? The nights are where the memories are made.\n\nA conversation at midnight that changes your perspective. A dance floor filled with people who felt like strangers three days earlier. An outfit you almost didn't pack becoming part of a story you'll tell for years.\n\nThat's why we created the Mindvalley U 2026 Party & Social Style Guide.\n\nNot as a list of rules. But as an invitation into the worlds we're creating together this summer in Tallinn.\n\nBecause each evening has its own energy.\n\nAnd yes… you're going to want to dress for the occasion.\n\n👉 Explore the full Mindvalley U 2026 Style Guide here: [Insert Link]\n\nThink of this as your backstage pass to the most unforgettable nights of the summer.\n\nPack boldly. Bring the outfit that feels a little too much. Those are usually the best ones.\n\nSee you in Tallinn,\nThe Mindvalley U Team", "Reference_2025_Copy": "[Copy from MVU 2026 Party customer comms doc — Jun 23 Style Guide reminder]", "Prep_Notification_Date": "2026-07-08"}, {"ID": "61", "Sequence": "Pre-Event Engagement", "Email_Name": "VIP Party Invitation - Week 1 (Midnight Cabaret)", "Audience": "VIP + First-Class Ticket Holders", "Subject_Line": "Your exclusive invitation: Mindvalley U 2026 - Midnight Cabaret ✨", "Proposed_Send_Date": "2026-07-15", "Day_of_Week": "Wednesday", "Status": "To Do", "CTA_Type": "Link", "CTA_Description": "Style Guide PDF link", "Notes": "Exclusive VIP/FC invitation for Midnight Cabaret (Jul 23). Originally planned Jun 30 in doc. | Repositioned to Wed Jul 15 (8 days before Midnight Cabaret on Jul 23) | UPDATED: venue changed from Manna La Roosa to Gloria (Müürivahe 2, Old Town). Added lineup: DJs Two Much + DJ Sammy, Special Performance Niraj Naik.", "Priority": "High", "Copy_2026": "Dear [First Name],\n\nSome places change your energy the moment you walk in.\n\nThe lighting softens. The music pulls you closer. And suddenly the outside world feels very far away.\n\nJuly 23rd will be one of those nights.\n\nYou're invited to Midnight Cabaret — an exclusive evening created for our First Class and VIP Mindvalley U guests.\n\nHidden inside the heart of Tallinn's Old Town, Gloria transforms into a world of velvet shadows, candlelight, theatrical beauty, and beautifully unexpected encounters.\n\nPart cabaret. Part dreamscape.\n\nThis isn't the kind of evening you simply attend.\n\nIt's one you disappear into.\n\nHere are the details:\n\n📍 Location: Gloria, Müürivahe 2, Tallinn\n📅 Date: Thursday, July 23, 2026\n🕘 Time: 9 PM – 1 AM\n🎫 Important: Your Mindvalley U VIP or First Class wristband is your only ticket for entry. Please make sure you wear it to access the party.\n\n🏛️ DJs:\nTwo Much\nDJ Sammy\n\n🎤 Special Performance:\nNiraj Naik\n\n🚖 Getting There\n🚶 Walking\nGloria is located in Tallinn Old Town, easily reachable by foot from most central locations.\n🚖 Taxi or Ride-share\nBolt and Uber operate throughout Tallinn. Simply search for \"Gloria\" in your maps app.\n\n🎙️ Dresscode: Cabaret Noir\nRich, expressive tones — black, deep red, emerald, gold, plum. Think velvet, silk, satin, lace, and sequins. Optional masks, veils, gloves, or headpieces for added intrigue.\n\nSomewhere between the whispered conversations, hidden performances, velvet curtains, you may just find the moments you remember most from Tallinn.\n\n✨ Looking for inspiration?\nThe full Mindvalley U 2026 Style Guide is waiting for you here:\n👉 [Click here to access the Style Guide PDF]\n\nSee you behind the velvet curtain,\nThe Mindvalley U Team", "Reference_2025_Copy": "[Copy from MVU 2026 Party customer comms doc — Jun 30 VIP Party invite Week 1]", "Prep_Notification_Date": "2026-07-08"}, {"ID": "63", "Sequence": "Pre-Event Last Mile", "Email_Name": "Week 1 Parties & Socials Calendar Reminder", "Audience": "All Valid Ticket Holders", "Subject_Line": "Ready to Spark Magic? Week 1 in Tallinn your evening guide awaits ✨", "Proposed_Send_Date": "2026-07-16", "Day_of_Week": "Thursday", "Status": "Cancelled", "CTA_Type": "Link", "CTA_Description": "Style Guide PDF link", "Notes": "Final pre-event reminder of Week 1 parties calendar. Originally planned Jul 16 in doc — kept same date (Thu). | CANCELLED on 2026-07-08: MERGED into #18 (Before You Arrive + Week 1 Parties Calendar) to avoid two overlapping broad emails on Thu Jul 16.", "Priority": "High", "Copy_2026": "Dear [First Name],\n\nThere's something that happens at Mindvalley U after sunset.\n\nThe schedules loosen. The conversations deepen. And somewhere between the music, the laughter, and the beautifully unexpected moments… strangers stop feeling like strangers.\n\nThis is the part of Mindvalley U that's impossible to explain to someone who hasn't experienced it.\n\nBecause these aren't just parties.\n\nThey're portals into entirely different worlds.\n\nAnd Week 1 in Tallinn is where it all begins.\n\nHere's what's waiting for you this week:\n\n🔵 Blue Block Party\n📅 Monday, July 20, 2026 | 🕖 7 PM – 11 PM | 📍 Rotermanni Quarter\nDresscode: Wear Blue\n\nFor one evening, the city becomes our campus. No single venue. No fixed path. Just hundreds of us flowing through five different spaces across one of Tallinn's most vibrant districts — following curiosity, conversation, and connection wherever they lead. Industrial architecture. Summer light. You'll start the night with friends you haven't met yet.\n\n🌙 ALT Monday\n📅 Monday, July 20, 2026 | 🕚 11 PM – 2 AM | 📍 Secret — revealed via app at 10 PM\nDresscode: Keep your Blue on\n\nAnd just when you think the night is winding down… Your phone lights up. At 10 PM, a secret location appears inside the app. By 11 PM, the tribe gathers again somewhere unexpected in the city for a late-night experience designed for the beautifully spontaneous. Keep your notifications on. And trust the adventure.\n\n🎭 Midnight Cabaret\n(First Class & VIP ticket holders)\n📅 Thursday, July 23, 2026 | 🕘 9 PM – 1 AM | 📍 Manna La Roosa, Vana-Posti tn 8\nDresscode: Cabaret Noir\n\nBehind velvet curtains another world opens. Part performance. Part mystery. This isn't the kind of night you watch unfold from the sidelines. It pulls you in slowly, through whispered conversations, fleeting performances, and moments that blur the line between guest and character. Come dressed for intrigue.\n\n🖤 Black Block Party\n📅 Friday, July 24, 2026 | 🕖 7 PM – 11 PM | 📍 Telliskivi Quarter\nDresscode: Wear Black\n\nTallinn changes character at night. And so do we. This time, we take over Telliskivi — the creative heart of the city, where street art, hidden courtyards, industrial spaces, and late-night conversations collide. The energy here is different. Rawer. Freer. A little more unexpected. Lose track of time in conversation with someone who feels strangely familiar after only ten minutes.\n\n🐇 Marvellous Wonderland\n📅 Saturday, July 25, 2026 | 🕝 8:30 PM – 2 AM | 📍 PROTO Invention Factory, Peetri tn 10\nDresscode: Marvellous Wonderland — Alice in Wonderland inspired\n\nThis is where the adventure truly begins.\n\nWe're taking over an old invention factory and transforming it into a surreal dreamscape inspired by Alice in Wonderland, part fantasy, part spectacle, part beautiful chaos. Expect the unexpected. Curious characters. Hidden surprises. Moments that make you feel like you've stepped outside ordinary life for a while.\n\n✨ The full Style Guide, including outfit inspiration, event aesthetics, and artist reveals, is now waiting for you.\n👉 [Click here to explore]\n\nPack the bold outfit. Say yes to the late-night conversation. Stay out longer than you planned.\n\nSee you after dark,\nThe Mindvalley U Team", "Reference_2025_Copy": "[Copy from MVU 2026 Party customer comms doc — Jul 16 Week 1 Calendar reminder]", "Prep_Notification_Date": "2026-07-09"}, {"ID": "71", "Sequence": "Pre-Event Engagement", "Email_Name": "VIP → First Class Upgrade (Come Closer)", "Audience": "VIP Ticket Holders", "Subject_Line": "There's a smaller room at MVU — we'd like you in it", "Proposed_Send_Date": "2026-07-16", "Day_of_Week": "Thursday", "Status": "To Do", "CTA_Type": "Link", "CTA_Description": "First Class upgrade form: https://airtable.com/app9UTVMuHPC8uTbx/pagLsxml19dIOhYjp/form", "Notes": "Targeted VIP→First Class upsell to existing VIP holders. UPDATED Jul 16 with corrected copy (adapted from first-person singular to team plural voice). New angle: room of max 20 people, Inner Circle sessions, kundalini with Dawn Hoang, tea ceremony, private dinner, concierge, FC lounge, front-row. Upgrade form: https://airtable.com/app9UTVMuHPC8uTbx/pagLsxml19dIOhYjp/form | Jul 16: merged colleague-2 additions into v2 (staccato opening, stays-as-is framing, value-stacking para, walk-into close, front-row sign-off). Subject and scarcity line untouched.", "Priority": "Medium", "Copy_2026": "Hi [First Name],\n\nYou've got your VIP ticket, so you're already in for the whole thing. The talks. The experiences. The parties. The priority seating. The conversations that tend to keep going long after the event ends.\n\nWe want to tell you about First Class, because it's one of the most curated experiences within Mindvalley U.\n\nFirst Class isn't more content. It's a room with a maximum of 15 people instead of hundreds. That's the entire idea, and everything else follows from it. When the room is that size, you're not queuing to say one sentence to a speaker — you're sitting down with them. Conversations get slower. You end up actually knowing the people around you by day three, rather than exchanging handles on the last night and never following up.\n\nEverything in your VIP ticket stays exactly as it is. First Class simply adds a more intimate layer on top:\n\nInner Circle sessions. Small-group time with the speakers — this is the part people tell us afterward was worth the whole thing. Small-group kundalini activation sessions with Dawn Hoang. A welcome tea ceremony in the middle of Tallinn's old town.\n\nA private dinner with a few selected authors. A table, a handful of people, and the kind of conversation that doesn't happen anywhere else that week.\n\nA personal concierge for the full two weeks. One person who knows your name and handles the logistics so you don't have to think about them.\n\nA private First Class lounge, with experiential elements designed to help you relax. Somewhere to go when you need to step out of the noise and genuinely connect with the other First Class students.\n\nFront-row seating. Reserved, not first-come.\n\nAnd it's one of the highest-value upgrades available right now — each of these experiences alone (the concierge, the Inner Circle sessions, a private dinner with the authors) is the kind of access people rarely get at an event this size.\n\nWe know First Class is for you if the reason you're coming to Tallinn has as much to do with who's in the room as what's on stage.\n\nThere's an intentionally small number of spots, to preserve the quality of the experience — and we have the last handful still available.\n\nSo this isn't for everyone. But if some part of you senses that Mindvalley U could be more than an event this year — the start of a friendship, a collaboration, an idea, a whole new chapter — this might be the room you were meant to walk into.\n\nIf this feels like the right experience for you, here's where to upgrade:\nhttps://airtable.com/app9UTVMuHPC8uTbx/pagLsxml19dIOhYjp/form\n\nSee you in the front row,\nThe Mindvalley U Team\n\nP.S. Sometimes the most important part of an event is not what happens on stage. It's who happens to be sitting beside you.", "Reference_2025_Copy": "[New for 2026 — targeted VIP-to-First-Class upsell with scarcity (3 spots).]", "Prep_Notification_Date": "2026-07-09"}, {"ID": "70", "Sequence": "Pre-Event Engagement", "Email_Name": "Accelerators Info", "Audience": "All Valid Ticket Holders", "Subject_Line": "5 exclusive Accelerator Sessions are coming to Mindvalley U", "Proposed_Send_Date": "2026-07-17", "Day_of_Week": "Friday", "Status": "To Do", "CTA_Type": "Soft", "CTA_Description": "Save-the-dates announcement — no hard CTA (details on timing/locations coming later)", "Notes": "Accelerator Sessions announcement (5 pre/side-event workshops). Access rules: Priestley/Hillyer/Vishen open to ALL ticket purchasers regardless of active dates; Allen/Kwik only for guests with access on those specific days. Send decision pending (\"ya se verá si lo mandamos\"). Images: comms-assets/accel-*.jpg before each session title. Start times: Priestley 5PM, Allen 11AM, Hillyer 6PM, Kwik 11AM, Vishen 11AM.", "Priority": "Medium", "Copy_2026": "Hi [First Name],\n\nThis year, Mindvalley U begins before the main event officially begins.\n\nBecause before we gather for the full experience, you'll have the opportunity to go deeper with five exclusive Accelerator Sessions led by some of Mindvalley's most loved teachers and business minds.\n\nThink of them as a powerful warm-up for your mind, your energy, your business—and possibly your calendar, because there is a lot of brilliance happening before August.\n\nHere's what's coming:\n\n![The Science of Growing Customers — Daniel Priestley, Sat 18-Sun 19 Jul](comms-assets/accel-priestley.jpg)\n\nThe Science of Growing Customers with Daniel Priestley\nSaturday, July 18 – Sunday, July 19, 2026 · Starts at 5:00 PM\n\nA practical deep dive into how to attract more of the right customers, build demand, and create sustainable business growth.\n\nThis session is included for everyone who has purchased a Mindvalley U ticket, whether or not their regular ticket access is active on these dates.\n\n![The Art of Un-Manifesting — Jeffrey Allen, Wed 22 Jul](comms-assets/accel-allen.jpg)\n\nThe Art of Un-Manifesting with Jeffrey Allen\nWednesday, July 22, 2026 · Starts at 11:00 AM\n\nExplore how to release the beliefs, energetic patterns, and attachments that may be quietly shaping your reality—and create more space for what truly belongs in your life.\n\nThis session is available to guests whose Mindvalley U ticket includes access on July 22.\n\n![The Wealth Code — Regan Hillyer, Sat 25-Sun 26 Jul](comms-assets/accel-hillyer.jpg)\n\nThe Wealth Code with Regan Hillyer\nSaturday, July 25 – Sunday, July 26, 2026 · Starts at 6:00 PM\n\nDiscover the inner beliefs, energetic shifts, and practical principles that can transform the way you create, receive, and relate to wealth.\n\nThis session is included for everyone who has purchased a Mindvalley U ticket, whether or not their regular ticket access is active on these dates.\n\n![The Limitless Brain — Jim Kwik, Thu 30 Jul](comms-assets/accel-kwik.jpg)\n\nThe Limitless Brain with Jim Kwik\nThursday, July 30, 2026 · Starts at 11:00 AM\n\nLearn how to improve your focus, strengthen your memory, learn faster, and unlock more of your brain's natural potential.\n\nThis session is available to guests whose Mindvalley U ticket includes access on July 30.\n\n![Become a World-Class Expert & Authority in Your Niche — Vishen, Sat 1 Aug](comms-assets/accel-vishen.jpg)\n\nBecome a World-Class Expert & Authority in Your Niche with Vishen\nSaturday, August 1, 2026 · Starts at 11:00 AM\n\nLearn how to clarify your unique expertise, communicate your ideas with authority, and build a personal brand that stands out in an increasingly noisy world.\n\nThis session is included for everyone who has purchased a Mindvalley U ticket, whether or not their regular ticket access is active on this date.\n\nSo, to make access crystal clear:\n\nThe weekend sessions with Daniel Priestley, Regan Hillyer, and Vishen are open to everyone who has purchased a Mindvalley U ticket, even when their regular ticket is not active on those dates.\n\nThe weekday sessions with Jeffrey Allen and Jim Kwik are available only to guests whose tickets include access to Mindvalley U on those specific days.\n\nFor now, save the dates.\n\nYour Mindvalley U journey is starting a little earlier this year—and that may be where some of your biggest breakthroughs begin.\n\nWith love,\nThe Mindvalley U Team\n\nSometimes the best part of the journey begins before you thought you had arrived. ✨", "Reference_2025_Copy": "[New for 2026 — Accelerator Sessions did not exist as email in 2025. Announces 5 pre/side-event deep-dive workshops with mixed access rules.]", "Prep_Notification_Date": "2026-07-10"}, {"ID": "72", "Sequence": "Pre-Event Engagement", "Email_Name": "Awards Gala & Afterparty", "Audience": "All Valid Ticket Holders", "Subject_Line": "The Awards Gala is back — Friday, July 24", "Proposed_Send_Date": "2026-07-18", "Day_of_Week": "Saturday", "Status": "To Do", "CTA_Type": "Link", "CTA_Description": "Afterparty tickets + VIP upgrade form", "Notes": "FINAL copy from Vishen (first-person voice). Awards Ceremony 6-7:30PM (part of regular agenda, all attendees) + Afterparty 7:30PM-midnight at Cauldron Hall (included VIP/FC, limited tickets for others). Black tie. Pre-header provided but Bizzabo does not support pre-headers: \"Friday, July 24. Black tie. Cauldron Hall until midnight.\" Images kept from previous version — positions chosen by Claude, review before send.", "Priority": "High", "Copy_2026": "Hi [First Name],\n\nI want to tell you about something we've decided to add to Mindvalley U this year, and why we think it might be one of the most special additions to your calendar for the first week.\n\nLast year in Dubai, we hosted the very first Mindvalley Awards Gala Night. Black tie, every author in one room, and a night that turned out to be one of the most memorable things we've ever done. If you've seen the photos, you know what I'm talking about.\n\n![Awards Gala — winners on stage (photo: All Is Amazing)](comms-assets/awards-gala-group.jpg)\n\nWe're bringing it back. Friday, July 24th, in Tallinn.\n\nHere's where the idea came from.\n\nWe spend the whole year building — programs, events, apps. And we wanted to create a moment where we stop and intentionally celebrate what this community has built together. Not just the authors. The students too. That's what started the Mindvalley Awards.\n\nThere are two parts to the night.\n\nFirst — the Awards Ceremony, 6:00 to 7:30 PM. We gather all the nominees and every author who's with us that week, and we hand out awards for the biggest accomplishments of the year. Speaker of the Year. Most Popular Program of the Year. Community Star Speaker of the Year. Workshop of the Year. Meditation of the Year. And more.\n\nThis is part of the regular Mindvalley U agenda. Every MVU attendee is in the room. You're already in.\n\nAnd here's the part that matters most to me: the awards are based on actual rating data from across our events and our apps. Not a committee. Not my opinion. It's what hundreds of thousands of people said, in the way people rate things when nobody's watching. Some go to authors you already know by name. Some go to people in our community who showed up to their first Mindvalley event exactly the way you are about to show up.\n\n![Awards Gala — acceptance speech (photo: All Is Amazing)](comms-assets/awards-gala-acceptance.jpg)\n\nThen at 7:30, Cauldron Hall changes completely.\n\nSecond — the Official Mindvalley U Awards Afterparty, 7:30 until midnight. Same room, entirely different energy. Music, dancing, and the thing that happens when a few hundred people who've spent the week doing hard work finally put it down for a night.\n\nThis one is separate from the agenda. It's included if you're VIP or First Class. If you're not, there's a limited number of afterparty tickets:\n\n🪩 Join the afterparty — https://www.mindvalley.com/u/tickets\n\nWorld-class photographers will be shooting portraits and moments all evening — which is my way of saying: it's black tie, so dress up. You'll want the photos.\n\nIf you'd like to be in the room for the rest of it too, you can request a VIP upgrade here:\n\n✨ Request your VIP upgrade — https://airtable.com/app9UTVMuHPC8uTbx/pagLsxml19dIOhYjp/form\n\nSee you in Tallinn,\nVishen", "Reference_2025_Copy": "[New for 2026 — Awards Gala + Afterparty combined announcement with afterparty ticket upsell and VIP upgrade CTA.]", "Prep_Notification_Date": "2026-07-11"}, {"ID": "14", "Sequence": "Pre-Event Engagement", "Email_Name": "VIP Ticket Holders Last Reminders", "Audience": "VIP Ticket Holders", "Subject_Line": "Ready for Week 1? Your VIP recap + everything you need before you arrive ✨", "Proposed_Send_Date": "2026-07-19", "Day_of_Week": "Sunday", "Status": "To Do", "CTA_Type": "Link", "CTA_Description": "Party Style Guide link", "Notes": "Full VIP access breakdown. Tallinn-specific venues. | Repositioned to Mon Jul 13 (was Jul 6, not sent) | Repositioned to Fri Jul 17 per user instruction (⚠️ Friday exception; matched with First Class Experience Details on same day so all tier-specific recaps go out together). | RENAMED to \"VIP Ticket Holders Last Reminders\" and moved to Sat Jul 18 as part of tier-specific Last Reminders wave. ⚠️ Copy needs updating to match \"Last Reminders\" theme (currently has VIP Experience Details / perks recap — should add practicalities + VIP party highlights like #18). | Rescheduled 2026-07-18 → 2026-07-19 (final pre-event reschedule).", "Priority": "High", "Copy_2026": "Hey [First Name],\n\nThe countdown is officially on, and we're so excited to welcome you to your Mindvalley U 2026 VIP experience — a journey designed to elevate every moment of your growth. 💛\n\nBefore we dive into your access list, don't forget:\n👉 Full details on parties and socials — including dress codes and themes — can be found in akers. Let's make it unforgettable.\n\nWith love,\nMindvalley U Team", "Reference_2025_Copy": "[Aug 2025 — First Class Experience]\nAudience: First-Class Ticket Holders\nSubject: Your Experience as a First Class Ticket Holder at Mindvalley U 2025 💫\nKey content: All VIP perks PLUS: first row seating, private Speaker Dinners. Two dinners listed: Carstens Brasserie (Aug 5) and Satchmo (Aug 12), both in Amsterdam with buffet and drinks. Full access breakdown. Signed by MV U Team.", "Prep_Notification_Date": "2026-07-12"}, {"ID": "18", "Sequence": "Pre-Event Last Mile", "Email_Name": "Standard Ticket Holders Last Reminders", "Audience": "Standard Ticket Holders", "Subject_Line": "Ready for Week 1 in Tallinn? Everything you need before you arrive ✨", "Proposed_Send_Date": "2026-07-19", "Day_of_Week": "Sunday", "Status": "To Do", "CTA_Type": "Link", "CTA_Description": "Style Guide + Attendee Guide + Apps", "Notes": "MERGED with #63 (Week 1 Parties Calendar Reminder) — one comprehensive pre-arrival email covering practicalities + Week 1 party calendar. Sent Thu Jul 16 (4 days before event). | Renamed to Standard Ticket Holders Last Reminders — VIP and First Class will receive their own tier-specific recaps (#14, #15) on same day (Fri Jul 17). This one goes to Standard tier only. | Moved from Thu Jul 16 to Sat Jul 18 to align with tier-specific Last Reminders wave (VIP + First Class same day). | Venue for Midnight Cabaret corrected: Manna La Roosa → Gloria. | Rescheduled 2026-07-18 → 2026-07-19 (final pre-event reschedule).", "Priority": "Critical", "Copy_2026": "Dear [First Name],\n\nMindvalley U 2026 in Tallinn is just days away — and we can't wait to welcome you.\n\nBefore you pack that second suitcase (yes, you'll need it), here's your final compass for the days ahead.\n\n🛬 Before You Arrive\n\nIf you haven't already:\n\n📘 Read your Attendee Guide — venue info, transport, restaurants, and everything you need to feel like a local from day one.\n📱 Download the Agenda App dventure.\n\n🎭 Midnight Cabaret\n(First Class & VIP ticket holders)\n📅 Thursday, July 23, 2026 | 🕘 9 PM – 1 AM | 📍 Gloria, Müürivahe 2\nDresscode: Cabaret Noir\n\nBehind velvet curtains another world opens. Part performance. Part mystery. This isn't the kind of night you watch unfold from the sidelines. It pulls you in slowly, through whispered conversations, fleeting performances, and moments that blur the line between guest and character. Come dressed for intrigue.\n\n🖤 Black Block Party\n📅 Friday, July 24, 2026 | 🕖 7 PM – 11 PM | 📍 Telliskivi Quarter\nDresscode: Wear Black\n\nTallinn changes character at night. And so do we. This time, we take over Telliskivi — the creative heart of the city, where street art, hidden courtyards, industrial spaces, and late-night conversations collide. The energy here is different. Rawer. Freer. A little more unexpected. Lose track of time in conversation with someone who feels strangely familiar after only ten minutes.\n\n🐇 Marvellous Wonderland\n📅 Saturday, July 25, 2026 | 🕝 8:30 PM – 2 AM | 📍 PROTO Invention Factory, Peetri tn 10\nDresscode: Marvellous Wonderland — Alice in Wonderland inspired\n\nThis is where the adventure truly begins.\n\nWe're taking over an old invention factory and transforming it into a surreal dreamscape inspired by Alice in Wonderland, part fantasy, part spectacle, part beautiful chaos. Expect the unexpected. Curious characters. Hidden surprises. Moments that make you feel like you've stepped outside ordinary life for a while.\n\n✨ The full Style Guide, including outfit inspiration, event aesthetics, and artist reveals, is now waiting for you.\n👉 [Click here to explore]\n\n—\n\nPack the bold outfit. Say yes to the late-night conversation. Stay out longer than you planned.\n\nSee you very soon in Tallinn,\nThe Mindvalley U Team", "Reference_2025_Copy": "[Aug 1, 2025 — Last Reminders]\nAudience: All Valid Ticket Holders\nSubject: Mindvalley U 2025: All You Need To Know Before Arriving 🌍\nKey content: Registration (Aug 4 at Beurs van Berlage, 10:30 AM+). Agenda App + Six App links. Navigating Amsterdam (trams, bikes, ferries). Youth Programs (WhatsApp groups for Kids 6-12 & Teens 13-17). Packing list (16-28°C weather). Welcome Social info. Style Guide link. Wristband requirement. Signed by MV University Team.", "Prep_Notification_Date": "2026-07-12"}, {"ID": "19", "Sequence": "Pre-Event Last Mile", "Email_Name": "Week 1 Summary / Day Before", "Audience": "All Valid Ticket Holders", "Subject_Line": "Are You Ready for Week 1 Magic? ✨", "Proposed_Send_Date": "2026-07-19", "Day_of_Week": "Sunday", "Status": "Cancelled", "CTA_Type": "Link", "CTA_Description": "Agenda App + Style Guide links", "Notes": "Day-before email. Registration, speakers, parties, Youth info. | CANCELLED on 2026-07-16: redundant with the 3 tier-specific Last Reminders sent same day (Sun Jul 19).", "Priority": "Critical", "Copy_2026": "Hey [First Name],\n\nThe moment we've all been waiting for is finally here — Week 1 of Mindvalley U 2026 kicks off tomorrow in the heart of Tallinn! 🇪🇪\n\nHere's everything you need to know to start strong:\n\n🛂 Registration — Monday, July 20\n\n📍 [Venue Name], [Address], Tallinn\n🕗 Register early from 10:30 AM onwards\n\nCome by to pick up your wristband, welcome materials, and say hi to your fellow attendees! The Welcome Session begins shortly after; please arrive early to complete your registration. Your kids will be welcome to their respective programs starting at 1 PM.\n\nDelicious options will be available at the venue throughout the day — from coffee and snacks to full lunch offerings.\n💳 Bring your card for onsite purchases.\n🚰 Don't forget your reusable water bottle.\n\n🌟 Welcome Session with Vishen\n\n🕐 Starts at 1:00 PM sharp on Monday, July 20.\nJoin us as Vishen officially opens this year's journey, setting the tone for the next two weeks of transformation and connection.\n\n🧒 Youth Programs kick off at 1:00 PM only on Monday, July 20. Make sure you drop of  Team\n\nP.S. Don't forget to wear your Mindvalley U wristband — it's your only key to enter the event. 🤍", "Reference_2025_Copy": "[Copy from MVU 2026 Party customer comms doc — Jul 7 VIP Party invite Week 2]", "Prep_Notification_Date": "2026-07-15"}, {"ID": "22", "Sequence": "During Event Week 1", "Email_Name": "Main Party Week 1", "Audience": "All Valid Ticket Holders", "Subject_Line": "[Main Party Theme TBD] — Tonight We Go Big 🚀", "Proposed_Send_Date": "2026-07-24", "Day_of_Week": "Friday", "Status": "To Do", "CTA_Type": "Link", "CTA_Description": "Venue details + map link", "Notes": "Main party of Week 1. Tallinn venue TBD.", "Priority": "High", "Copy_2026": "Hi [First Name],\n\nThis Saturday, July 25th, we're taking you somewhere extraordinary...\n\n[Party Name TBD] is not just a party — it's an experience.\n\nFrom the moment you step in, you'll be surrounded by [description TBD based on theme and venue]. Bold. Electric. Unforgettable.\n\n📍 Location: [Venue TBD], Tallinn\n🕗 Time: 8:30 PM – 2:00 AM\n\n✨ For Families: Kids will have a dedicated space with activities so younger guests can enjoy their own magic.\n🍽 Food & Drinks: Bring card or cash for purchases. Dinner options will be available.\n🎟 Tickets: Included with your Mindvalley U pass. Just wear your wristband for seamless entry.\n\nThis isn't just a Saturday night out. This is [Party Name].\nSee you on the dance floor.\n\nWith excitement,\nThe Mindvalley U Team", "Reference_2025_Copy": "[Aug 9, 2025 — Amaze Party / Into the Future]\nAudience: VIP Ticket Holders (separate version for all)\nSubject: 🚀Step Into the Future Tonight\nKey content: Into the Future party at Amaze venue. Aug 9, 8:30 PM-2 AM. LED tunnel, immersive space. Kids dedicated area. F&B by card/cash. Wristband entry. Signed by MV U Team.", "Prep_Notification_Date": "2026-07-17"}, {"ID": "23", "Sequence": "During Event Week 1", "Email_Name": "Feedback Week 1", "Audience": "All Valid Ticket Holders", "Subject_Line": "Share Your Feedback About Week 1 & Win a Ticket for MVU 2027 🌟", "Proposed_Send_Date": "2026-07-25", "Day_of_Week": "Saturday", "Status": "To Do", "CTA_Type": "Link", "CTA_Description": "Feedback survey link", "Notes": "Collect Week 1 feedback. Prize: 2 x MVU 2027 tickets.", "Priority": "High", "Copy_2026": "Hi [First Name],\n\nYour voice matters — and we'd love to hear it.\n\nWe're gathering feedback on your experience about Week 1 at Mindvalley U 2026 to make next year even more extraordinary.\n\n✨ As a thank you, everyone who submits their feedback about Week 1 will be entered into a draw to select two winners for Mindvalley U 2027.\n\n📌 Important: If you choose to remain anonymous, you are welcome to share your feedback — but please note that anonymous entries cannot participate in the draw, as we'll have no way to contact you.\n\n📝 Share your feedback here: [Survey Link]\n\nYour insights will help us shape the magic of next year's event. Thank you for co-creating this journey with us.\n\nWith gratitude,\nThe Mindvalley U Team", "Reference_2025_Copy": "[Aug 11, 2025 — Feedback Week 1]\nAudience: All Valid Ticket Holders\nSubject: Share Your Feedback About Week 1 & Win a Ticket for Mindvalley U 2026 🌟\nKey content: Week 1 feedback collection. Prize: 2 x MVU 2026 tickets. Anonymous entries can't participate in draw. Survey link. Signed by MV U Team.", "Prep_Notification_Date": "2026-07-18"}, {"ID": "24", "Sequence": "During Event Week 2", "Email_Name": "Welcome to Week 2", "Audience": "All Valid Ticket Holders", "Subject_Line": "Welcome to Week 2 — The Journey Continues ✨", "Proposed_Send_Date": "2026-07-26", "Day_of_Week": "Sunday", "Status": "To Do", "CTA_Type": "Link", "CTA_Description": "Agenda App + Style Guide links", "Notes": "Week 2 overview: registration, speakers, parties, Youth updates.", "Priority": "High", "Copy_2026": "Dear [First Name],\n\nWelcome to Week 2 of Mindvalley U 2026 in Tallinn — where the magic keeps unfolding. Whether you've been with us since Day 1 or are j function initCurrentMonth() {
  const now = new Date();
  const todayStr = now.toISOString().split('T')[0];

  // 1. If browser's today is within the data range, use today
  const dates = allData
    .map(d => d.Proposed_Send_Date)
    .filter(d => d && d !== 'TBD')
    .sort();
  if (dates.length > 0) {
    const earliest = dates[0];
    const latest = dates[dates.length - 1];
    if (todayStr >= earliest && todayStr <= latest) {
      currentMonth = new Date(now.getFullYear(), now.getMonth(), 1);
      return;
    }
  }

  // 2. Otherwise, use the month of the next upcoming (To Do) email
  const upcoming = allData
    .filter(d => d.Status === 'To Do' && d.Proposed_Send_Date && d.Proposed_Send_Date !== 'TBD' && d.Proposed_Send_Date >= todayStr)
    .sort((a, b) => a.Proposed_Send_Date.localeCompare(b.Proposed_Send_Date))[0];
  if (upcoming) {
    const [y, m] = upcoming.Proposed_Send_Date.split('-').map(Number);
    currentMonth = new Date(y, m - 1, 1);
    return;
  }

  // 3. Otherwise, use the month of the latest Sent email
  const latestSent = allData
    .filter(d => d.Status === 'Sent' && d.Proposed_Send_Date && d.Proposed_Send_Date !== 'TBD')
    .sort((a, b) => b.Proposed_Send_Date.localeCompare(a.Proposed_Send_Date))[0];
  if (latestSent) {
    const [y, m] = latestSent.Proposed_Send_Date.split('-').map(Number);
    currentMonth = new Date(y, m - 1, 1);
    return;
  }

  // 4. Fallback stays as Jul 2026 (event month)
}

// ============================================================
// DATA LOADING
// ============================================================
async function loadData() {
  if (CONFIG.USE_AIRTABLE && CONFIG.AIRTABLE_TOKEN) {
    try {
      const records = await fetchAirtable();
      allData = records;
      updateSyncBadge(true);
    } catch (e) {
      console.warn('Airtable fetch failed, using embedded data:', e);
      allData = EMBEDDED_DATA;
      updateSyncBadge(false);
    }
  } else {
    allData = EMBEDDED_DATA;
    updateSyncBadge(false);
  }
  initCurrentMonth();
  applyFilters();
  render();
}

async function fetchAirtable() {
  let all = [];
  let offset = null;
  do {
    const url = `https://api.airtable.com/v0/${CONFIG.AIRTABLE_BASE_ID}/${CONFIG.AIRTABLE_TABLE_ID}?pageSize=100` + (offset ? `&offset=${offset}` : '');
    const res = await fetch(url, { headers: { 'Authorization': `Bearer ${CONFIG.AIRTABLE_TOKEN}` } });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    json.records.forEach(r => all.push(r.fields));
    offset = json.offset;
  } while (offset);
  return all;
}

function updateSyncBadge(connected) {
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('syncText');
  if (connected) {
    dot.className = 'status-dot connected';
    text.textContent = `Airtable · synced ${new Date().toLocaleTimeString()}`;
  } else {
    dot.className = 'status-dot offline';
    text.textContent = 'Offline mode · embedded data';
  }
}

// ============================================================
// FILTERS
// ============================================================
function buildFilters() {
  const bar = document.getElementById('filtersBar');
  const audiences = [...new Set(allData.map(d => d.Audience))].sort();
  const sequences = ['Pre-Event Engagement', 'Pre-Event Last Mile', 'During Event Week 1', 'During Event Week 2', 'Post Event'];
  const priorities = ['Critical', 'High', 'Medium', 'Low'];

  bar.innerHTML = `
    <div class="filter-group">
      <label>Sequence</label>
      <div class="filter-pills">
        ${sequences.map(s => `<span class="pill" data-filter="sequence" data-value="${s}">${SEQUENCE_EMOJI[s] || ''} ${s.replace('Pre-Event ', '').replace('During Event ', '')}</span>`).join('')}
      </div>
    </div>
    <div class="filter-group">
      <label>Priority</label>
      <div class="filter-pills">
        ${priorities.map(p => `<span class="pill" data-filter="priority" data-value="${p}" style="--pill-color:${PRIORITY_COLORS[p]}">${p}</span>`).join('')}
      </div>
    </div>
  `;

  bar.querySelectorAll('.pill').forEach(pill => {
    pill.addEventListener('click', () => {
      const type = pill.dataset.filter;
      const value = pill.dataset.value;
      const idx = activeFilters[type].indexOf(value);
      if (idx >= 0) {
        activeFilters[type].splice(idx, 1);
        pill.classList.remove('active');
      } else {
        activeFilters[type].push(value);
        pill.classList.add('active');
      }
      applyFilters();
      render();
    });
  });
}

function applyFilters() {
  filteredData = allData.filter(d => {
    if (activeFilters.audience.length && !activeFilters.audience.includes(d.Audience)) return false;
    if (activeFilters.sequence.length && !activeFilters.sequence.includes(d.Sequence)) return false;
    if (activeFilters.priority.length && !activeFilters.priority.includes(d.Priority)) return false;
    return true;
  });
}

// ============================================================
// KPI
// ============================================================
function renderKPIs() {
  const total = filteredData.length;
  const byStatus = {};
  filteredData.forEach(d => { byStatus[d.Status] = (byStatus[d.Status] || 0) + 1; });

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card">
      <div class="kpi-value gold">${total}</div>
      <div class="kpi-label">Total Emails</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-value purple">${byStatus['To Do'] || 0}</div>
      <div class="kpi-label">To Do</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-value green">${byStatus['Sent'] || 0}</div>
      <div class="kpi-label">Sent</div>
    </div>
    <div class="kpi-card" style="opacity:0.6">
      <div class="kpi-value" style="color:var(--text-muted);text-decoration:line-through">${byStatus['Cancelled'] || 0}</div>

// ============================================================
// LEGEND
// ============================================================
function renderLegend() {
  const usedAudiences = [...new Set(filteredData.map(d => d.Audience))];
  document.getElementById('legend').innerHTML = usedAudiences.map(a => {
    const info = getAudienceInfo(a);
    return `<div class="legend-item"><div class="legend-color" style="background:${info.color}"></div>${info.label}</div>`;
  }).join('');
}

// ============================================================
// CALENDAR VIEW
// ============================================================
function renderCalendar() {
  const container = document.getElementById('calendarView');
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  let startDay = firstDay.getDay() - 1;
  if (startDay < 0) startDay = 6;

  // Group emails by date
  const emailsByDate = {};
  filteredData.forEach(d => {
    if (!d.Proposed_Send_Date || d.Proposed_Send_Date === 'TBD') return;
    if (!emailsByDate[d.Proposed_Send_Date]) emailsByDate[d.Proposed_Send_Date] = [];
    emailsByDate[d.Proposed_Send_Date].push(d);
  });

  const todayStr = new Date().toISOString().split('T')[0];

  let html = `
    <div class="month-header">
      <div class="month-nav">
        <button onclick="navMonth(-1)">‹</button>
      </div>
      <div class="month-title">${monthNames[month]} ${year}</div>
      <div class="month-nav">
        <button onclick="navMonth(1)">›</button>
      </div>
    </div>
    <div class="month-grid">
      ${dayNames.map(d => `<div class="day-header">${d}</div>`).join('')}
  `;

  // Empty cells before first day
  for (let i = 0; i < startDay; i++) {
    html += `<div class="day-cell empty"></div>`;
  }

  // Day cells
  for (let day = 1; day <= lastDay.getDate(); day++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isToday = dateStr === todayStr;
    const emails = emailsByDate[dateStr] || [];

    html += `<div class="day-cell${isToday ? ' today' : ''}">
      <div class="day-number">${day}</div>
      ${emails.map(e => {
        const info = getAudienceInfo(e.Audience);
        const cancelledCls = e.Status === 'Cancelled' ? ' cancelled' : '';
        return `<div class="email-chip ${info.class}${cancelledCls}" onclick='openModal(${JSON.stringify(e.ID).replace(/'/g, "\'")})'
          title="${e.Email_Name}">
          ${e.Email_Name.substring(0, 22)}${e.Email_Name.length > 22 ? '…' : ''}
        </div>`;
      }).join('')}
    </div>`;
  }

  html += `</div>`;
  container.innerHTML = html;
}

function navMonth(delta) {
  currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + delta);
  renderCalendar();
}

// ============================================================
// TIMELINE VIEW
// ============================================================
function renderTimeline() {
  const container = document.getElementById('timelineView');

  // Date range: Feb 2026 to Oct 2026
  const startDate = new Date(2026, 1, 1);
  const endDate = new Date(2026, 9, 1);
  const totalDays = (endDate - startDate) / (1000 * 60 * 60 * 24);

  const monthNames = ['Feb','Mar','Apr','May','Jun','Jul','Aug','Sep'];
  const todayStr = new Date().toISOString().split('T')[0];
  const todayDate = new Date();
  const todayOffset = (todayDate - startDate) / (1000 * 60 * 60 * 24);
  const todayPct = Math.max(0, Math.min(100, (todayOffset / totalDays) * 100));

  // Group by audience
  const groups = {};
  filteredData.forEach(d => {
    if (!d.Proposed_Send_Date || d.Proposed_Send_Date === 'TBD') return;
    if (!groups[d.Audience]) groups[d.Audience] = [];
    groups[d.Audience].push(d);
  });

  // Month labels
  let monthsHtml = '<div class="timeline-months">';
  for (let m = 1; m <= 8; m++) {
    const mStart = new Date(2026, m, 1);
    const mEnd = new Date(2026, m + 1, 0);
    const left = ((mStart - startDate) / (1000 * 60 * 60 * 24) / totalDays) * 100;
    const width = ((mEnd - mStart) / (1000 * 60 * 60 * 24) / totalDays) * 100;
    monthsHtml += `<div class="timeline-month-label" style="width:${width}%;text-align:center">${monthNames[m-1]}</div>`;
  }
  monthsHtml += '</div>';

  // Event period highlight
  const eventStart = new Date(2026, 6, 20);
  const eventEnd = new Date(2026, 7, 2);
  const evLeft = ((eventStart - startDate) / (1000 * 60 * 60 * 24) / totalDays) * 100;
  const evWidth = ((eventEnd - eventStart) / (1000 * 60 * 60 * 24) / totalDays) * 100;

  let html = monthsHtml;

  const sortedGroups = Object.keys(groups).sort((a, b) => {
    const aFirst = groups[a].sort((x, y) => x.Proposed_Send_Date.localeCompare(y.Proposed_Send_Date))[0];
    const bFirst = groups[b].sort((x, y) => x.Proposed_Send_Date.localeCompare(y.Proposed_Send_Date))[0];
    return aFirst.Proposed_Send_Date.localeCompare(bFirst.Proposed_Send_Date);
  });

  for (const audience of sortedGroups) {
    const info = getAudienceInfo(audience);
    const emails = groups[audience];

    html += `<div class="swimlane">
      <div class="swimlane-label">
        <span class="swimlane-dot" style="background:${info.color}"></span>
        ${info.label}
        <span style="color:var(--text-muted);font-weight:400;font-size:0.7rem">(${emails.length})</span>
      </div>
      <div class="swimlane-track" style="position:relative">
        <div style="position:absolute;left:${evLeft}%;width:${evWidth}%;top:0;bottom:0;background:rgba(212,168,67,0.06);border-radius:4px;"></div>
        ${todayPct > 0 && todayPct < 100 ? `<div class="today-marker" style="left:${todayPct}%"></div>` : ''}
        ${emails.map(e => {
          const eDate = new Date(e.Proposed_Send_Date + 'T00:00:00');
          const left = ((eDate - startDate) / (1000 * 60 * 60 * 24) / totalDays) * 100;
          const cancelledCls = e.Status === 'Cancelled' ? ' cancelled' : '';
          return `<div class="timeline-block ${info.class}${cancelledCls}" style="left:${left}%;min-width:80px;"
            onclick='openModal("${e.ID}")'
            title="${e.Email_Name} — ${e.Proposed_Send_Date}">
            ${e.Email_Name.substring(0, 18)}${e.Email_Name.length > 18 ? '…' : ''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  container.innerHTML = html;
}

// ============================================================
// MODAL
// ============================================================
function openModal(id) {
  const email = allData.find(d => d.ID === id || d.ID === String(id));
  if (!email) return;

  const info = getAudienceInfo(email.Audience);

  document.getElementById('modalTitle').textContent = email.Email_Name;
  document.getElementById('modalSubject').textContent = `📧 ${email.Subject_Line}`;

  document.getElementById('modalMeta').innerHTML = `
    <span class="meta-tag" style="border-color:${info.color};color:${info.color};background:${info.color}15">${email.Audience}</span>
    <span class="meta-tag" style="border-color:var(--purple);color:var(--purple-light);background:rgba(124,58,237,0.1)">${email.Sequence}</span>
    <span class="meta-tag" style="border-color:${PRIORITY_COLORS[email.Priority]};color:${PRIORITY_COLORS[email.Priority]};background:transparent">${email.Priority}</span>
    <span class="meta-tag" style="border-color:var(--card-border);color:var(--text-dim);background:transparent">📅 ${email.Proposed_Send_Date} (${email.Day_of_Week})</span>
    <span class="meta-tag" style="border-color:var(--card-border);color:var(--text-dim);background:transparent">🔔 Notify: ${email.Prep_Notification_Date || '—'}</span>
    <span class="meta-tag" style="border-color:var(--card-border);color:var(--text-dim);background:transparent">Status: ${email.Status}</span>
  `;

  let bodyHtml = '';

  if (email.CTA_Description) {
    bodyHtml += `
      <div class="modal-section">
        <div class="modal-section-title">CTA</div>
        <div style="color:var(--text-dim);font-size:0.85rem">${email.CTA_Type}: ${email.CTA_Description}</div>
      </div>`;
  }

  if (email.Notes) {
    bodyHtml += `
      <div class="modal-section">
        <div class="modal-section-title">Notes</div>
        <div style="color:var(--text-dim);font-size:0.85rem">${email.Notes}</div>
      </div>`;
  }

  if (email.Copy_2026) {
    bodyHtml += `
      <div class="modal-section">
        <div class="modal-section-title">Copy 2026 (Proposed)</div>
        <div class="copy-block">${renderCopy(email.Copy_2026)}</div>
      </div>`;
  }

  if (email.Reference_2025_Copy) {
    bodyHtml += `
      <div class="modal-section">
        <div class="modal-section-title">Reference 2025</div>
        <div class="ref-block">${escapeHtml(email.Reference_2025_Copy)}</div>
      </div>`;
  }

  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Render copy text with support for markdown images: ![alt](url)
// Everything else is escaped; images become inline <img> blocks.
function renderCopy(str) {
  const imgRe = /!\[([^\]]*)\]\(([^)]+)\)/g;
  let out = '';
  let last = 0;
  let m;
  while ((m = imgRe.exec(str)) !== null) {
    out += escapeHtml(str.slice(last, m.index));
    const alt = escapeHtml(m[1]);
    const url = m[2].replace(/"/g, '&quot;');
    out += `<img src="${url}" alt="${alt}" style="display:block;max-width:100%;border-radius:8px;margin:12px 0;border:1px solid var(--card-border)" loading="lazy">`;
    last = m.index + m[0].length;
  }
  out += escapeHtml(str.slice(last));
  return out;
}

// ============================================================
// VIEW TOGGLE
// ============================================================
document.querySelectorAll('.view-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentView = btn.dataset.view;
    document.getElementById('calendarView').classList.toggle('active', currentView === 'calendar');
    document.getElementById('timelineView').classList.toggle('active', currentView === 'timeline');
    if (currentView === 'timeline') renderTimeline();
  });
});

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeModal();
});

// Close on ESC
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

// ============================================================
// RENDER
// ============================================================
function render() {
  renderKPIs();
  renderLegend();
  renderCalendar();
  if (currentView === 'timeline') renderTimeline();
}

// ============================================================
// INIT
// ============================================================
loadData().then(() => {
  buildFilters();

  // Auto-refresh if Airtable is active
  if (CONFIG.USE_AIRTABLE && CONFIG.AIRTABLE_TOKEN) {
    setInterval(loadData, CONFIG.REFRESH_INTERVAL);
  }
});
</script>
